
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil člana | DocBizHub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      color: #25283d;
    }
    header {
      background: #2b2d42;
      color: white;
      padding: 18px;
      text-align: center;
    }
    header a { color: white; text-decoration: none; font-weight: bold; }
    main {
      max-width: 720px;
      margin: 28px auto;
      padding: 24px;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000010;
    }
    h1 { margin-top: 0; overflow-wrap: anywhere; }
    .item {
      padding: 15px 0;
      border-bottom: 1px solid #e7e7ed;
    }
    .item:last-child { border-bottom: 0; }
    .label {
      display: block;
      color: #626579;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
      text-transform: uppercase;
    }
    .value { white-space: pre-wrap; overflow-wrap: anywhere; }
    .message { padding: 18px 0; line-height: 1.5; }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 9px;
      background: #3742fa;
      color: white;
      text-decoration: none;
      border: 0;
      cursor: pointer;
    }
    .hidden { display: none; }
    footer { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
  <header>
    <a href="DASHBOARD.html">🚀 DocBizHub</a>
  </header>

  <main>
    <section class="card">
      <div id="status" class="message">Učitavam profil člana...</div>

      <div id="profile" class="hidden">
        <h1 id="name"></h1>
        <div id="fields"></div>
        <a class="button" href="DASHBOARD.html">Nazad na dashboard</a>
      </div>
    </section>
  </main>

  <footer>© 2026 DocBizHub</footer>

  <script>
    const SUPABASE_URL =
      "https://uduwpvdjmanrgpumdrfh.supabase.co";

    // Koristi javni anon/publishable ključ iz svog projekta.
    // Nikada ovdje ne stavljaj service_role ključ.
   
const SUPABASE_ANON_KEY =
  "sb_publishable_IfX6dxz-ILfYK_3VgelcMw_tYOX0y45";


    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const statusEl = document.getElementById("status");
    const profileEl = document.getElementById("profile");
    const params = new URLSearchParams(window.location.search);

    function prikaziPolje(naziv, vrijednost) {
      if (vrijednost === null || vrijednost === undefined ||
          String(vrijednost).trim() === "") return "";

      const row = document.createElement("div");
      row.className = "item";

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = naziv;

      const value = document.createElement("div");
      value.className = "value";
      value.textContent = String(vrijednost);

      row.append(label, value);
      return row;
    }

    async function ucitajProfil() {
      try {
        // Prednost ima ID iz URL-a. E-mail je podržan
        // samo radi postojećih linkova u obavijestima.
        const userId = params.get("id");
        const email = params.get("korisnik");

        if (!userId && !email) {
          throw new Error("Nije naveden profil koji treba otvoriti.");
        }

        // Tražimo samo polja koja želimo prikazati.
        // MAIL, TELEFON i drugi privatni podaci nisu vraćeni.
        let query = db
          .from("POSAO_KORISNICI")
          .select(
            'USER, IME, GRAD, DJELATNOST, VRSTA_SARADNJE, JA, TRAZIM, SITE, LINKEDIN'
          );

        if (userId) {
          query = query.eq("USER", userId);
        } else {
          query = query.ilike("MAIL", email);
        }

        const { data, error } = await query.maybeSingle();

        if (error) throw error;
        if (!data) {
          throw new Error(
            "Profil nije pronađen ili nemaš dozvolu da ga pregledaš."
          );
        }

        document.getElementById("name").textContent =
          data.IME || "Član DocBizHuba";

        const fields = document.getElementById("fields");

        fields.append(
          prikaziPolje("Grad", data.GRAD),
          prikaziPolje("Djelatnost", data.DJELATNOST),
          prikaziPolje("Vrsta saradnje", data.VRSTA_SARADNJE),
          prikaziPolje("O članu / Šta nudi", data.JA),
          prikaziPolje("Šta traži", data.TRAZIM)
        );

        // Linkovi se prikazuju samo ako su validni HTTP(S) URL-ovi.
        for (const [label, raw] of [
          ["Web stranica", data.SITE],
          ["LinkedIn", data.LINKEDIN]
        ]) {
          if (!raw) continue;
          try {
            const url = new URL(raw);
            if (url.protocol !== "https:" && url.protocol !== "http:") {
              continue;
            }
            const row = document.createElement("div");
            row.className = "item";
            const title = document.createElement("span");
            title.className = "label";
            title.textContent = label;
            const link = document.createElement("a");
            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Otvori " + label;
            row.append(title, link);
            fields.append(row);
          } catch (_) {
            // Ne prikazuj neispravne URL-ove.
          }
        }

        statusEl.classList.add("hidden");
        profileEl.classList.remove("hidden");
      } catch (error) {
        console.error("Greška pri učitavanju profila:", error);
        statusEl.textContent =
          error.message || "Profil trenutno nije moguće učitati.";
      }
    }

    ucitajProfil();
  </script>
</body>
</html>
