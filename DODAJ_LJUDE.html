<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodaj Ljude - DocBizHub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #1e293b;
}

header {
    background: linear-gradient(135deg, #0f172a, #1e3a5f);
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.back-btn {
    color: white;
    text-decoration: none;
    background: rgba(255,255,255,0.12);
    padding: 10px 16px;
    border-radius: 8px;
}

.back-btn:hover {
    background: rgba(255,255,255,0.2);
}

.hero {
    text-align: center;
    padding: 50px 20px 30px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.hero p {
    color: #64748b;
    max-width: 700px;
    margin: auto;
    line-height: 1.6;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.form-box {
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    margin-bottom: 35px;
}

.form-box h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    margin-bottom: 6px;
    font-weight: bold;
    font-size: 14px;
}

input,
select,
textarea {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #2563eb;
}

.btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.btn:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #64748b;
}

.btn-secondary:hover {
    background: #475569;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 15px;
}

.search {
    width: 280px;
    max-width: 100%;
}

.people-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.person-card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    transition: transform 0.2s;
}

.person-card:hover {
    transform: translateY(-3px);
}

.avatar {
    width: 58px;
    height: 58px;
    background: #dbeafe;
    color: #2563eb;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 14px;
}

.person-card h3 {
    margin: 0 0 5px;
}

.position {
    color: #2563eb;
    font-size: 14px;
    font-weight: bold;
}

.company {
    color: #64748b;
    margin: 8px 0;
}

.info {
    font-size: 14px;
    color: #475569;
    line-height: 1.7;
}

.tag {
    display: inline-block;
    background: #eff6ff;
    color: #2563eb;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 8px;
}

.delete-btn {
    margin-top: 15px;
    border: none;
    background: #fee2e2;
    color: #dc2626;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.empty {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 16px;
    color: #64748b;
    grid-column: 1 / -1;
}

footer {
    margin-top: 60px;
    background: #0f172a;
    color: #cbd5e1;
    text-align: center;
    padding: 25px;
}

@media (max-width: 800px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .people-grid {
        grid-template-columns: 1fr;
    }

    .section-title {
        flex-direction: column;
        align-items: stretch;
    }

    .search {
        width: 100%;
    }

    .hero h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">👥 DocBizHub</div>
    <a href="DASHBOARD.html" class="back-btn">← Nazad na Dashboard</a>
</header>

<section class="hero">
    <h1>👥 Dodaj Ljude</h1>
    <p>
        Dodaj poslovne kontakte, saradnike, klijente i članove svog poslovnog
        kruga na jednom mjestu.
    </p>
</section>

<div class="container">

    <div class="form-box">
        <h2>➕ Dodaj novu osobu</h2>

        <form id="personForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Ime i prezime *</label>
                    <input type="text" id="name" placeholder="npr. Ime Prezime" required>
                </div>

                <div class="form-group">
                    <label for="position">Pozicija</label>
                    <input type="text" id="position" placeholder="npr. Direktor">
                </div>

                <div class="form-group">
                    <label for="company">Firma / Organizacija</label>
                    <input type="text" id="company" placeholder="Naziv firme">
                </div>

                <div class="form-group">
                    <label for="city">Grad</label>
                    <input type="text" id="city" placeholder="npr. Travnik">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="email@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Telefon</label>
                    <input type="text" id="phone" placeholder="+387 ...">
                </div>

                <div class="form-group">
                    <label for="category">Kategorija</label>
                    <select id="category">
                        <option value="Saradnik">Saradnik</option>
                        <option value="Klijent">Klijent</option>
                        <option value="Dobavljač">Dobavljač</option>
                        <option value="Partner">Partner</option>
                        <option value="Investitor">Investitor</option>
                        <option value="Ostalo">Ostalo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="website">Web stranica</label>
                    <input type="text" id="website" placeholder="https://...">
                </div>

                <div class="form-group full">
                    <label for="description">Napomena</label>
                    <textarea id="description"
                        placeholder="Dodaj kratku napomenu o kontaktu..."></textarea>
                </div>

                <div class="form-group full">
                    <button type="submit" class="btn">
                        ➕ Sačuvaj kontakt
                    </button>
                </div>

            </div>

        </form>
    </div>

    <div class="section-title">
        <h2>📋 Moji kontakti</h2>
        <input
            type="text"
            id="search"
            class="search"
            placeholder="🔎 Pretraži kontakte..."
        >
    </div>

    <div class="people-grid" id="peopleGrid"></div>

</div>

<footer>
    © 2026 DocBizHub — Poslovanje na jednom mjestu
</footer>

<script>

let people = JSON.parse(localStorage.getItem("docbizhub_people")) || [];

const form = document.getElementById("personForm");
const grid = document.getElementById("peopleGrid");
const search = document.getElementById("search");

function savePeople() {
    localStorage.setItem("docbizhub_people", JSON.stringify(people));
}

function getInitials(name) {
    return name
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(word => word[0].toUpperCase())
        .join("");
}

function renderPeople(filter = "") {

    grid.innerHTML = "";

    const filtered = people.filter(person => {

        const text = `
            ${person.name}
            ${person.position}
            ${person.company}
            ${person.city}
            ${person.category}
            ${person.email}
        `.toLowerCase();

        return text.includes(filter.toLowerCase());
    });

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty">
                <h3>👤 Nema kontakata</h3>
                <p>Dodaj prvu osobu koristeći formu iznad.</p>
            </div>
        `;
        return;
    }

    filtered.forEach(person => {

        const card = document.createElement("div");
        card.className = "person-card";

        card.innerHTML = `
            <div class="avatar">${getInitials(person.name)}</div>

            <h3>${escapeHtml(person.name)}</h3>

            <div class="position">
                ${escapeHtml(person.position || "Poslovni kontakt")}
            </div>

            <div class="company">
                🏢 ${escapeHtml(person.company || "Nije navedena firma")}
            </div>

            <div class="info">
                ${person.city ? `📍 ${escapeHtml(person.city)}<br>` : ""}
                ${person.email ? `📧 ${escapeHtml(person.email)}<br>` : ""}
                ${person.phone ? `📞 ${escapeHtml(person.phone)}<br>` : ""}
                ${person.website ? `🌐 ${escapeHtml(person.website)}<br>` : ""}
                ${person.description ? `<br>${escapeHtml(person.description)}` : ""}
            </div>

            <span class="tag">
                ${escapeHtml(person.category)}
            </span>

            <br>

            <button
                class="delete-btn"
                onclick="deletePerson(${person.id})">
                🗑 Obriši
            </button>
        `;

        grid.appendChild(card);
    });
}

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

form.addEventListener("submit", function(e) {

    e.preventDefault();

    const person = {
        id: Date.now(),
        name: document.getElementById("name").value.trim(),
        position: document.getElementById("position").value.trim(),
        company: document.getElementById("company").value.trim(),
        city: document.getElementById("city").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        category: document.getElementById("category").value,
        website: document.getElementById("website").value.trim(),
        description: document.getElementById("description").value.trim()
    };

    people.push(person);

    savePeople();
    renderPeople();

    form.reset();

    alert("Kontakt je uspješno dodat.");
});

function deletePerson(id) {

    if (!confirm("Da li želiš obrisati ovaj kontakt?")) {
        return;
    }

    people = people.filter(person => person.id !== id);

    savePeople();
    renderPeople(search.value);
}

search.addEventListener("input", function() {
    renderPeople(this.value);
});

renderPeople();

</script>

</body>
</html>
