
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset lozinke | DOCBIZHUB</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #1d3557);
      color: #fff;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 18px;
      background: #fff;
      color: #172033;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    h1 { margin-top: 0; text-align: center; }
    p { color: #64748b; text-align: center; line-height: 1.5; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      margin-top: 17px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      line-height: 1.5;
    }

    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #1769e0;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Nova lozinka</h1>
    <p>Unesite novu lozinku za svoj DOCBIZHUB račun.</p>

    <form id="resetForm">
      <label for="password">Nova lozinka</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Najmanje 8 znakova"
        required
      >

      <label for="confirmPassword">Potvrdite novu lozinku</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Ponovite lozinku"
        required
      >

      <button id="saveButton" type="submit">
        SAČUVAJ NOVU LOZINKU
      </button>
    </form>

    <div id="message" role="status"></div>

    <a class="back" href="/LOGIN.html">← Povratak na prijavu</a>
  </main>

  <script>
    // OVDJE UNESI ISTE PODATKE KAO U LOGIN.html
    const SUPABASE_URL = "OVDJE_UNESI_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "OVDJE_UNESI_SUPABASE_ANON_KEY";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveButton");
    const message = document.getElementById("message");

    let recoveryReady = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
      message.style.display = "block";
    }

    function setFormEnabled(enabled) {
      recoveryReady = enabled;
      form.querySelectorAll("input, button").forEach(el => {
        el.disabled = !enabled;
      });
    }

    setFormEnabled(false);

    async function checkRecoverySession() {
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        showMessage(
          "Link za promjenu lozinke nije važeći ili je istekao. Zatražite novi link na stranici za prijavu.",
          "error"
        );
        return;
      }

      setFormEnabled(true);
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        setFormEnabled(true);
      }
    });

    checkRecoverySession();

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!recoveryReady) {
        showMessage("Prvo otvorite važeći link za promjenu lozinke iz e-maila.", "error");
        return;
      }

      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Lozinka mora imati najmanje 8 znakova.", "error");
        return;
      }

      if (password !== confirmation) {
        showMessage("Lozinke se ne podudaraju.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "ČUVANJE...";

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        showMessage("Greška: " + error.message, "error");
        button.disabled = false;
        button.textContent = "SAČUVAJ NOVU LOZINKU";
        return;
      }

      showMessage(
        "Lozinka je uspješno promijenjena! Sada se možete prijaviti.",
        "success"
      );

      form.reset();

      await supabase.auth.signOut();

      button.textContent = "USPJEŠNO SAČUVANO";

      setTimeout(() => {
        window.location.href = "/LOGIN.html";
      }, 2500);
    });
  </script>
</body>
</html>
