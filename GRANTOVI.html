<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grantovi & Fondovi | DocBizHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            color: white;
            padding: 22px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.12);
            padding: 10px 16px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.22);
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .hero {
            background: white;
            border-radius: 18px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .hero p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
        }

        .search-box {
            margin-top: 22px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #edf1f5;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.10);
        }

        .icon {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .card p {
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 9px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            padding: 35px 20px;
            color: #94a3b8;
            font-size: 14px;
        }

        .empty {
            display: none;
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .header {
                padding: 18px;
            }

            .hero {
                padding: 25px;
            }

            .hero h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">📊 DocBizHub</div>

    <a href="DASHBOARD.html" class="back-btn">
        ← Nazad na Dashboard
    </a>
</header>

<main class="container">

    <section class="hero">

        <h1>💰 Grantovi & Fondovi</h1>

        <p>
            Pronađite dostupne grantove, fondove, javne pozive i programe
            podrške za razvoj poslovanja.
        </p>

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="🔎 Pretraži grantove i fondove..."
                onkeyup="searchCards()"
            >

        </div>

    </section>


    <section
        class="grid"
        id="grantGrid"
    >

        <div
            id="LOADING_GRANTOVA"
            style="
                grid-column:1 / -1;
                text-align:center;
                padding:40px;
                color:#64748b;
            "
        >
            ⏳ Učitavanje grantova...
        </div>

    </section>


    <div
        class="empty"
        id="empty"
    >
        Nema rezultata za unesenu pretragu.
    </div>

</main>


<footer class="footer">
    © 2026 DocBizHub — Grantovi & Fondovi
</footer>


<script>

const SUPABASE_URL =
    "https://uduwpvdjmanrgpumdrfh.supabase.co";


const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdXdwdmRqbWFucmdwdW1kcmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTEwODQsImV4cCI6MjEwMDM4NzA4NH0.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ";

async function UCITAJ_GRANTOVE() {

    const GRID =
        document.getElementById("grantGrid");


    try {

        const ODGOVOR = await fetch(

            `${SUPABASE_URL}/rest/v1/GRANTOVI?select=*&STATUS=eq.AKTIVAN&order=DATUM_OBJAVE.desc`,

            {
                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_ANON_KEY}`

                }
            }

        );


        if (!ODGOVOR.ok) {

            throw new Error(
                `GREŠKA: ${ODGOVOR.status}`
            );

        }


        const GRANTOVI =
            await ODGOVOR.json();


        GRID.innerHTML = "";


        if (!GRANTOVI.length) {

            GRID.innerHTML = `

                <div
                    style="
                        grid-column:1/-1;
                        text-align:center;
                        padding:40px;
                        color:#64748b;
                    "
                >
                    Trenutno nema aktivnih grantova.
                </div>

            `;

            return;

        }


        GRANTOVI.forEach(GRANT => {

            const DATUM =
                GRANT.DATUM_OBJAVE
                ? new Date(
                    GRANT.DATUM_OBJAVE
                  ).toLocaleDateString("bs-BA")
                : "Nije navedeno";


            const ROK =
                GRANT.ROK
                ? new Date(
                    GRANT.ROK
                  ).toLocaleDateString("bs-BA")
                : "Nije naveden";


            const CARD =
                document.createElement("div");


            CARD.className =
                "card";


            CARD.innerHTML = `

                <div class="icon">
                    💰
                </div>


                <h2>
                    ${SIGURAN_TEKST(GRANT.NASLOV)}
                </h2>


                <p>
                    ${SIGURAN_TEKST(
                        GRANT.OPIS || ""
                    )}
                </p>


                <p style="
                    font-size:13px;
                    color:#64748b;
                    margin-bottom:8px;
                ">
                    📁
                    ${SIGURAN_TEKST(
                        GRANT.KATEGORIJA || ""
                    )}
                </p>


                <p style="
                    font-size:13px;
                    color:#64748b;
                    margin-bottom:8px;
                ">
                    📅 Objavljeno:
                    ${DATUM}
                </p>


                <p style="
                    font-size:13px;
                    color:#64748b;
                    margin-bottom:18px;
                ">
                    ⏰ Rok:
                    ${ROK}
                </p>


                <a
                    href="${SIGURAN_URL(GRANT.URL)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn"
                >
                    Saznaj više →
                </a>

            `;


            GRID.appendChild(CARD);

        });

    }


    catch (GRESKA) {

        console.error(
            "GREŠKA PRI UČITAVANJU GRANTOVA:",
            GRESKA
        );


        GRID.innerHTML = `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:40px;
                    color:#dc2626;
                "
            >
                ❌ Grantovi trenutno nisu dostupni.
            </div>

        `;

    }

}



function SIGURAN_TEKST(TEKST) {

    const DIV =
        document.createElement("div");


    DIV.textContent =
        TEKST || "";


    return DIV.innerHTML;

}



function SIGURAN_URL(URL) {

    try {

        const TEST =
            new URL(URL);


        if (
            TEST.protocol === "http:" ||
            TEST.protocol === "https:"
        ) {

            return TEST.href;

        }

    }

    catch (GRESKA) {}

    return "#";

}



function searchCards() {

    const SEARCH =
        document
            .getElementById("search")
            .value
            .toLowerCase();


    const CARDS =
        document.querySelectorAll(".card");


    let FOUND = 0;


    CARDS.forEach(CARD => {

        const TEXT =
            CARD.innerText.toLowerCase();


        if (TEXT.includes(SEARCH)) {

            CARD.style.display =
                "";

            FOUND++;

        }

        else {

            CARD.style.display =
                "none";

        }

    });


    document.getElementById("empty")
        .style.display =
            FOUND === 0
            ? "block"
            : "none";

}



UCITAJ_GRANTOVE();

</script>

</body>
</html>
