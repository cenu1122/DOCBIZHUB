<!DOCTYPE html>
<html lang="bs">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grantovi & Fondovi | DocBizHub</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;
            color: #1f2937;
        }


        .header {
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a5f
                );

            color: white;

            padding: 22px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.12);
        }


        .logo {
            font-size: 24px;
            font-weight: 700;
        }


        .back-btn {
            color: white;
            text-decoration: none;

            background:
                rgba(255,255,255,0.12);

            padding: 10px 16px;

            border-radius: 10px;

            transition: 0.2s;

            white-space: nowrap;
        }


        .back-btn:hover {
            background:
                rgba(255,255,255,0.22);
        }


        .container {
            max-width: 1200px;

            margin: 35px auto;

            padding: 0 20px;
        }


        .hero {
            background: white;

            border-radius: 18px;

            padding: 35px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }


        .hero h1 {
            font-size: 32px;

            margin-bottom: 10px;

            color: #0f172a;
        }


        .hero p {
            color: #64748b;

            font-size: 16px;

            line-height: 1.6;
        }


        .filters {
            display: grid;

            grid-template-columns:
                1fr 220px 220px;

            gap: 12px;

            margin-top: 22px;
        }


        .search-box input,
        .filter-select {

            width: 100%;

            padding: 15px 18px;

            border:
                1px solid #dbe2ea;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            background: white;
        }


        .search-box input:focus,
        .filter-select:focus {

            border-color: #2563eb;
        }


        .result-info {

            margin-top: 15px;

            color: #64748b;

            font-size: 14px;
        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 20px;
        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.06);

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            border:
                1px solid #edf1f5;

            display: flex;

            flex-direction: column;
        }


        .card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.10);
        }


        .icon {

            font-size: 35px;

            margin-bottom: 15px;
        }


        .card h2 {

            font-size: 20px;

            margin-bottom: 12px;

            color: #0f172a;

            line-height: 1.4;
        }


        .card p {

            color: #64748b;

            line-height: 1.5;

            margin-bottom: 12px;
        }


        .meta {

            margin-top: auto;

            padding-top: 10px;
        }


        .meta-row {

            font-size: 13px;

            color: #64748b;

            margin-bottom: 8px;

            line-height: 1.5;
        }


        .status {

            display: inline-block;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 14px;
        }


        .status-aktivan {

            background: #dcfce7;

            color: #166534;
        }


        .status-istekao {

            background: #fee2e2;

            color: #991b1b;
        }


        .status-zatvoren {

            background: #e2e8f0;

            color: #475569;
        }


        .btn {

            display: inline-block;

            text-decoration: none;

            background: #2563eb;

            color: white;

            padding: 11px 16px;

            border-radius: 9px;

            font-weight: 600;

            transition: 0.2s;

            margin-top: 8px;

            cursor: pointer;
        }


        .btn:hover {

            background: #1d4ed8;
        }


        .btn-disabled {

            background: #94a3b8;

            cursor: not-allowed;

            pointer-events: none;
        }


        .source {

            font-size: 12px;

            color: #94a3b8;

            margin-top: 12px;
        }


        /* =========================================================
           DOKUMENTI
           ========================================================= */


        .documents-box {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid #e5e7eb;
        }


        .documents-title {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 15px;

            font-weight: 700;

            color: #0f172a;

            margin-bottom: 12px;
        }


        .documents-list {

            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .document-link {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            text-decoration: none;

            background: #f8fafc;

            border:
                1px solid #e2e8f0;

            border-radius: 10px;

            padding: 11px 13px;

            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.2s;
        }


        .document-link:hover {

            background: #eff6ff;

            border-color: #bfdbfe;

            transform:
                translateX(2px);
        }


        .document-left {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }


        .document-icon {

            font-size: 20px;

            flex-shrink: 0;
        }


        .document-name {

            color: #1e3a8a;

            font-size: 13px;

            font-weight: 600;

            line-height: 1.35;
        }


        .document-type {

            display: inline-block;

            margin-top: 3px;

            font-size: 10px;

            color: #64748b;

            text-transform: uppercase;

            letter-spacing: 0.3px;
        }


        .document-arrow {

            color: #2563eb;

            font-size: 17px;

            flex-shrink: 0;
        }


        .documents-count {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 22px;

            height: 22px;

            padding: 0 6px;

            border-radius: 20px;

            background: #dbeafe;

            color: #1d4ed8;

            font-size: 11px;

            font-weight: 700;
        }


        .empty {

            display: none;

            text-align: center;

            padding: 45px 20px;

            color: #64748b;

            background: white;

            border-radius: 16px;

            margin-top: 20px;
        }


        .error {

            grid-column: 1 / -1;

            text-align: center;

            padding: 45px 20px;

            color: #dc2626;

            background: white;

            border-radius: 16px;
        }


        .loading {

            grid-column: 1 / -1;

            text-align: center;

            padding: 45px 20px;

            color: #64748b;

            background: white;

            border-radius: 16px;
        }


        .footer {

            text-align: center;

            padding: 35px 20px;

            color: #94a3b8;

            font-size: 14px;
        }


        @media (max-width: 850px) {

            .filters {

                grid-template-columns:
                    1fr 1fr;

            }

            .search-box {

                grid-column:
                    1 / -1;

            }

        }


        @media (max-width: 700px) {

            .header {

                padding: 18px;

                flex-direction: column;

                align-items: stretch;
            }


            .back-btn {

                text-align: center;
            }


            .hero {

                padding: 25px;
            }


            .hero h1 {

                font-size: 26px;
            }


            .filters {

                grid-template-columns: 1fr;
            }


            .search-box {

                grid-column: auto;
            }


            .grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<main class="container">

</main>


<footer class="footer">

    © 2026 DocBizHub —

</footer>


<script>


/* =========================================================
   SUPABASE
   ========================================================= */


const SUPABASE_URL =
    "https://uduwpvdjmanrgpumdrfh.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_IfX6dxz-ILfYK_3VgelcMw_tYOX0y45";


/* =========================================================
   SVI GRANTOVI
   ========================================================= */


let SVI_GRANTOVI = [];


/* =========================================================
   SVI DOKUMENTI
   ========================================================= */


let SVI_DOKUMENTI = [];


/* =========================================================
   MAPA DOKUMENATA
   ========================================================= */


let DOKUMENTI_PO_GRANTU = {};


/* =========================================================
   SIGURAN TEKST
   ========================================================= */


function SIGURAN_TEKST(TEKST) {

    const DIV =
        document.createElement("div");


    DIV.textContent =
        TEKST === null ||
        TEKST === undefined
            ? ""
            : String(TEKST);


    return DIV.innerHTML;

}


/* =========================================================
   SIGURAN URL
   ========================================================= */


function SIGURAN_URL(URL_VRIJEDNOST) {

    if (
        URL_VRIJEDNOST === null ||
        URL_VRIJEDNOST === undefined
    ) {

        return null;

    }


    let SIROVI_URL =
        String(URL_VRIJEDNOST).trim();


    if (!SIROVI_URL) {

        return null;

    }


    SIROVI_URL =
        SIROVI_URL
            .replace(
                /^["']+|["']+$/g,
                ""
            )
            .trim();


    if (!SIROVI_URL) {

        return null;

    }


    if (
        !/^https?:\/\//i.test(
            SIROVI_URL
        )
    ) {

        console.warn(
            "URL NIJE HTTP/HTTPS:",
            SIROVI_URL
        );

        return null;

    }


    try {

        const TEST =
            new URL(
                SIROVI_URL
            );


        if (
            TEST.protocol === "http:" ||
            TEST.protocol === "https:"
        ) {

            return TEST.href;

        }

    }

    catch (GRESKA) {

        console.warn(
            "NEISPRAVAN URL:",
            SIROVI_URL,
            GRESKA
        );

    }


    return null;

}


/* =========================================================
   DATUM
   ========================================================= */


function FORMAT_DATUMA(DATUM) {

    if (!DATUM) {

        return "Nije navedeno";

    }


    const TEST =
        new Date(DATUM);


    if (
        Number.isNaN(
            TEST.getTime()
        )
    ) {

        return "Nije navedeno";

    }


    return TEST.toLocaleDateString(
        "bs-BA"
    );

}


/* =========================================================
   NORMALIZUJ STATUS
   ========================================================= */


function NORMALIZUJ_STATUS(STATUS) {

    return String(
        STATUS || "AKTIVAN"
    )
        .trim()
        .toUpperCase();

}


/* =========================================================
   STATUS NAZIV
   ========================================================= */


function STATUS_NAZIV(STATUS) {

    const NORMALIZOVANI_STATUS =
        NORMALIZUJ_STATUS(STATUS);


    if (
        NORMALIZOVANI_STATUS ===
        "ISTEKAO"
    ) {

        return "Istekao";

    }


    if (
        NORMALIZOVANI_STATUS ===
        "ZATVOREN"
    ) {

        return "Zatvoren";

    }


    return "Aktivan";

}


/* =========================================================
   STATUS KLASA
   ========================================================= */


function STATUS_KLASA(STATUS) {

    const NORMALIZOVANI_STATUS =
        NORMALIZUJ_STATUS(STATUS);


    if (
        NORMALIZOVANI_STATUS ===
        "ISTEKAO"
    ) {

        return "status-istekao";

    }


    if (
        NORMALIZOVANI_STATUS ===
        "ZATVOREN"
    ) {

        return "status-zatvoren";

    }


    return "status-aktivan";

}


/* =========================================================
   NORMALIZUJ TIP DOKUMENTA
   ========================================================= */


function NORMALIZUJ_TIP_DOKUMENTA(TIP) {

    return String(
        TIP || "DOKUMENT"
    )
        .trim()
        .toUpperCase();

}


/* =========================================================
   IKONA DOKUMENTA
   ========================================================= */


function IKONA_DOKUMENTA(TIP) {

    const NORMALIZOVANI_TIP =
        NORMALIZUJ_TIP_DOKUMENTA(
            TIP
        );


    if (
        NORMALIZOVANI_TIP ===
        "JAVNI_POZIV"
    ) {

        return "📢";

    }


    if (
        NORMALIZOVANI_TIP ===
        "PRAVILNIK"
    ) {

        return "📘";

    }


    if (
        NORMALIZOVANI_TIP ===
        "OBRAZAC"
    ) {

        return "📋";

    }


    if (
        NORMALIZOVANI_TIP ===
        "VODIC"
    ) {

        return "📕";

    }


    if (
        NORMALIZOVANI_TIP ===
        "PROGRAM"
    ) {

        return "📑";

    }


    if (
        NORMALIZOVANI_TIP ===
        "PDF"
    ) {

        return "📄";

    }


    return "📎";

}


/* =========================================================
   NAZIV TIPA DOKUMENTA
   ========================================================= */


function NAZIV_TIPA_DOKUMENTA(TIP) {

    const NORMALIZOVANI_TIP =
        NORMALIZUJ_TIP_DOKUMENTA(
            TIP
        );


    const NAZIVI = {

        "JAVNI_POZIV":
            "Javni poziv",

        "PRAVILNIK":
            "Pravilnik",

        "OBRAZAC":
            "Obrazac",

        "VODIC":
            "Vodič",

        "PROGRAM":
            "Program",

        "PDF":
            "PDF dokument",

        "OSTALO":
            "Ostalo",

        "DOKUMENT":
            "Dokument"

    };


    return (
        NAZIVI[
            NORMALIZOVANI_TIP
        ] ||
        NORMALIZOVANI_TIP
    );

}


/* =========================================================
   UČITAJ GRANTOVE
   ========================================================= */


async function UCITAJ_GRANTOVE() {

    const URL =
        `${SUPABASE_URL}/rest/v1/GRANTOVI?select=*&order=ROK.asc.nullslast,DATUM_OBJAVE.desc`;


    console.log(
        "UČITAVAM GRANTOVE:",
        URL
    );


    const ODGOVOR =
        await fetch(
            URL,
            {

                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Accept":
                        "application/json"

                }

            }
        );


    console.log(
        "GRANTOVI STATUS:",
        ODGOVOR.status
    );


    if (!ODGOVOR.ok) {

        const TEKST_GRESKE =
            await ODGOVOR.text();


        throw new Error(
            `Supabase greška pri učitavanju grantova ${ODGOVOR.status}: ${TEKST_GRESKE}`
        );

    }


    const PODACI =
        await ODGOVOR.json();


    if (!Array.isArray(PODACI)) {

        throw new Error(
            "Supabase nije vratio niz grantova."
        );

    }


    SVI_GRANTOVI =
        PODACI;


    console.log(
        "GRANTOVI UČITANI:",
        SVI_GRANTOVI.length
    );

}


/* =========================================================
   UČITAJ DOKUMENTE
   ========================================================= */


async function UCITAJ_DOKUMENTE() {

    const URL =
        `${SUPABASE_URL}/rest/v1/GRANT_DOKUMENTI?select=*&AKTIVAN=eq.true&order=GRANT_ID.asc,REDOSLIJED.asc,ID.asc`;


    console.log(
        "UČITAVAM DOKUMENTE:",
        URL
    );


    const ODGOVOR =
        await fetch(
            URL,
            {

                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Accept":
                        "application/json"

                }

            }
        );


    console.log(
        "DOKUMENTI STATUS:",
        ODGOVOR.status
    );


    if (!ODGOVOR.ok) {

        const TEKST_GRESKE =
            await ODGOVOR.text();


        throw new Error(
            `Supabase greška pri učitavanju dokumenata ${ODGOVOR.status}: ${TEKST_GRESKE}`
        );

    }


    const PODACI =
        await ODGOVOR.json();


    if (!Array.isArray(PODACI)) {

        throw new Error(
            "Supabase nije vratio niz dokumenata."
        );

    }


    SVI_DOKUMENTI =
        PODACI;


    console.log(
        "DOKUMENTI UČITANI:",
        SVI_DOKUMENTI.length
    );


    /* =====================================================
       NAPRAVI MAPU:
       GRANT_ID -> DOKUMENTI
       ===================================================== */


    DOKUMENTI_PO_GRANTU = {};


    SVI_DOKUMENTI.forEach(
        DOKUMENT => {

            const GRANT_ID =
                String(
                    DOKUMENT.GRANT_ID
                );


            if (
                !DOKUMENTI_PO_GRANTU[
                    GRANT_ID
                ]
            ) {

                DOKUMENTI_PO_GRANTU[
                    GRANT_ID
                ] = [];

            }


            DOKUMENTI_PO_GRANTU[
                GRANT_ID
            ].push(
                DOKUMENT
            );

        }
    );


    console.log(
        "MAPA DOKUMENATA:",
        DOKUMENTI_PO_GRANTU
    );

}


/* =========================================================
   UČITAJ SVE
   ========================================================= */


async function UCITAJ_SVE() {

    const GRID =
        document.getElementById(
            "grantGrid"
        );


    const RESULT_INFO =
        document.getElementById(
            "resultInfo"
        );


    try {

        console.log(
            "===================================="
        );


        console.log(
            "POČETAK UČITAVANJA DOCBIZHUB GRANTOVA"
        );


        console.log(
            "===================================="
        );


        /*
           Učitavamo grantove i dokumente
           paralelno.
        */

        await Promise.all(
            [

                UCITAJ_GRANTOVE(),

                UCITAJ_DOKUMENTE()

            ]
        );


        const LOADING =
            document.getElementById(
                "loading"
            );


        if (LOADING) {

            LOADING.remove();

        }


        PRIKAZI_GRANTOVE();

    }


    catch (GRESKA) {

        console.error(
            "GREŠKA PRI UČITAVANJU:",
            GRESKA
        );


        if (GRID) {

            GRID.innerHTML = `

                <div class="error">

                    ❌ Podaci trenutno nisu dostupni.

                    <br><br>

                    ${SIGURAN_TEKST(
                        GRESKA.message ||
                        "Nepoznata greška."
                    )}

                </div>

            `;

        }


        if (RESULT_INFO) {

            RESULT_INFO.textContent =
                "Greška pri učitavanju podataka.";

        }

    }

}


/* =========================================================
   NAPRAVI HTML ZA DOKUMENTE
   ========================================================= */


function NAPRAVI_DOKUMENTE_HTML(GRANT_ID) {

    const KLJUC =
        String(
            GRANT_ID
        );


    const DOKUMENTI =
        DOKUMENTI_PO_GRANTU[
            KLJUC
        ] || [];


    /*
       Ako nema dokumenata,
       ne prikazujemo ništa.
    */

    if (
        DOKUMENTI.length === 0
    ) {

        return "";

    }


    const VALIDNI_DOKUMENTI =
        DOKUMENTI
            .map(
                DOKUMENT => {

                    const URL_VRIJEDNOST =
                        DOKUMENT.URL ??
                        DOKUMENT.url ??
                        DOKUMENT["URL"] ??
                        "";


                    const SIGURNI_URL =
                        SIGURAN_URL(
                            URL_VRIJEDNOST
                        );


                    return {

                        DOKUMENT,

                        SIGURNI_URL

                    };

                }
            )
            .filter(
                STAVKA =>
                    STAVKA.SIGURNI_URL
            );


    if (
        VALIDNI_DOKUMENTI.length === 0
    ) {

        return "";

    }


    let HTML = `

        <div class="documents-box">

            <div class="documents-title">

                <span>
                    📄 Dokumenti
                </span>

                <span class="documents-count">
                    ${VALIDNI_DOKUMENTI.length}
                </span>

            </div>


            <div class="documents-list">

    `;


    VALIDNI_DOKUMENTI.forEach(
        STAVKA => {

            const DOKUMENT =
                STAVKA.DOKUMENT;


            const URL =
                STAVKA.SIGURNI_URL;


            const NAZIV =
                DOKUMENT.NAZIV ||
                "Dokument";


            const TIP =
                DOKUMENT.TIP_DOKUMENTA ||
                "DOKUMENT";


            const OPIS =
                DOKUMENT.OPIS ||
                "";


            HTML += `

                <a
                    href="${SIGURAN_TEKST(URL)}"
                    class="document-link"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="${SIGURAN_TEKST(
                        OPIS ||
                        "Otvori dokument"
                    )}"
                >

                    <div class="document-left">

                        <span class="document-icon">

                            ${IKONA_DOKUMENTA(TIP)}

                        </span>


                        <div>

                            <div class="document-name">

                                ${SIGURAN_TEKST(
                                    NAZIV
                                )}

                            </div>


                            <div class="document-type">

                                ${SIGURAN_TEKST(
                                    NAZIV_TIPA_DOKUMENTA(
                                        TIP
                                    )
                                )}

                            </div>

                        </div>

                    </div>


                    <span class="document-arrow">

                        ↗

                    </span>

                </a>

            `;

        }
    );


    HTML += `

            </div>

        </div>

    `;


    return HTML;

}


/* =========================================================
   PRIKAŽI GRANTOVE
   ========================================================= */


function PRIKAZI_GRANTOVE() {

    const GRID =
        document.getElementById(
            "grantGrid"
        );


    const EMPTY =
        document.getElementById(
            "empty"
        );


    const RESULT_INFO =
        document.getElementById(
            "resultInfo"
        );


    const SEARCH_ELEMENT =
        document.getElementById(
            "search"
        );


    const CATEGORY_ELEMENT =
        document.getElementById(
            "categoryFilter"
        );


    const STATUS_ELEMENT =
        document.getElementById(
            "statusFilter"
        );


    const SEARCH =
        SEARCH_ELEMENT
            ? SEARCH_ELEMENT.value
                .trim()
                .toLowerCase()
            : "";


    const KATEGORIJA =
        CATEGORY_ELEMENT
            ? CATEGORY_ELEMENT.value
            : "";


    const STATUS_FILTER =
        STATUS_ELEMENT
            ? STATUS_ELEMENT.value
            : "AKTIVAN";


    /* =========================================================
       FILTRIRANJE
       ========================================================= */


    const FILTRIRANI =
        SVI_GRANTOVI.filter(
            GRANT => {

                /* -----------------------------------------
                   PRETRAGA
                   ----------------------------------------- */


                const TEKST = [

                    GRANT.NASLOV,

                    GRANT.OPIS,

                    GRANT.KATEGORIJA,

                    GRANT.INSTITUCIJA,

                    GRANT.IZVOR,

                    GRANT.KO_MOZE_APLICIRATI,

                    GRANT.STA_SE_FINANSIRA,

                    GRANT.IZNOS_PODRSKE,

                    GRANT.SUFINANSIRANJE,

                    GRANT.PROJEKAT,

                    GRANT.POTREBNA_DOKUMENTACIJA

                ]
                    .filter(
                        VRIJEDNOST =>
                            VRIJEDNOST !== null &&
                            VRIJEDNOST !== undefined
                    )
                    .join(" ")
                    .toLowerCase();


                const ODGOVARA_PRETRAZI =
                    !SEARCH ||
                    TEKST.includes(
                        SEARCH
                    );


                /* -----------------------------------------
                   KATEGORIJA
                   ----------------------------------------- */


                const GRANT_KATEGORIJA =
                    String(
                        GRANT.KATEGORIJA || ""
                    )
                        .trim()
                        .toUpperCase();


                const FILTER_KATEGORIJA =
                    String(
                        KATEGORIJA || ""
                    )
                        .trim()
                        .toUpperCase();


                const ODGOVARA_KATEGORIJI =
                    !FILTER_KATEGORIJA ||
                    GRANT_KATEGORIJA ===
                        FILTER_KATEGORIJA;


                /* -----------------------------------------
                   STATUS
                   ----------------------------------------- */


                const GRANT_STATUS =
                    NORMALIZUJ_STATUS(
                        GRANT.STATUS
                    );


                const ODGOVARA_STATUSU =
                    STATUS_FILTER === "SVE" ||
                    GRANT_STATUS ===
                        STATUS_FILTER;


                return (
                    ODGOVARA_PRETRAZI &&
                    ODGOVARA_KATEGORIJI &&
                    ODGOVARA_STATUSU
                );

            }
        );


    /* =========================================================
       OBRIŠI STARE CARDOVE
       ========================================================= */


    GRID.innerHTML = "";


    /* =========================================================
       NEMA REZULTATA
       ========================================================= */


    if (
        FILTRIRANI.length === 0
    ) {

        EMPTY.style.display =
            "block";


        RESULT_INFO.textContent =
            "Nema pronađenih grantova.";


        return;

    }


    EMPTY.style.display =
        "none";


    /* =========================================================
       TEKST STATUSA
       ========================================================= */


    let TEKST_STATUSA =
        "svih";


    if (
        STATUS_FILTER ===
        "AKTIVAN"
    ) {

        TEKST_STATUSA =
            "aktivnih";

    }


    if (
        STATUS_FILTER ===
        "ISTEKAO"
    ) {

        TEKST_STATUSA =
            "isteklih";

    }


    if (
        STATUS_FILTER ===
        "ZATVOREN"
    ) {

        TEKST_STATUSA =
            "zatvorenih";

    }


    RESULT_INFO.textContent =
        `Prikazano ${FILTRIRANI.length} ${TEKST_STATUSA} grantova.`;


    /* =========================================================
       KREIRAJ SVAKI CARD
       ========================================================= */


    FILTRIRANI.forEach(
        GRANT => {

            const CARD =
                document.createElement(
                    "article"
                );


            CARD.className =
                "card";


            /* -----------------------------------------
               DATUM
               ----------------------------------------- */


            const DATUM =
                FORMAT_DATUMA(
                    GRANT.DATUM_OBJAVE
                );


            /* -----------------------------------------
               ROK
               ----------------------------------------- */


            const ROK =
                FORMAT_DATUMA(
                    GRANT.ROK
                );


            /* -----------------------------------------
               STATUS
               ----------------------------------------- */


            const STATUS =
                NORMALIZUJ_STATUS(
                    GRANT.STATUS
                );


            /* -----------------------------------------
               DOKUMENTI
               ----------------------------------------- */


            const DOKUMENTI_HTML =
                NAPRAVI_DOKUMENTE_HTML(
                    GRANT.ID
                );


            /* =================================================
               CARD SADRŽAJ
               ================================================= */


            CARD.innerHTML = `

                <div class="icon">
                    💰
                </div>


                <span
                    class="status ${STATUS_KLASA(STATUS)}"
                >
                    ${STATUS_NAZIV(STATUS)}
                </span>


                <h2>
                    ${SIGURAN_TEKST(
                        GRANT.NASLOV
                    )}
                </h2>


                <p>
                    ${SIGURAN_TEKST(
                        GRANT.OPIS ||
                        "Informacije o javnom pozivu."
                    )}
                </p>


                <div class="meta">


                    <div class="meta-row">

                        📁

                        <strong>
                            Kategorija:
                        </strong>

                        ${SIGURAN_TEKST(
                            GRANT.KATEGORIJA ||
                            "Nije navedeno"
                        )}

                    </div>


                    <div class="meta-row">

                        🏛️

                        <strong>
                            Institucija:
                        </strong>

                        ${SIGURAN_TEKST(
                            GRANT.INSTITUCIJA ||
                            "Nije navedeno"
                        )}

                    </div>


                    <div class="meta-row">

                        📅

                        <strong>
                            Objavljeno:
                        </strong>

                        ${DATUM}

                    </div>


                    <div class="meta-row">

                        ⏰

                        <strong>
                            Rok:
                        </strong>

                        ${ROK}

                    </div>


                    <!-- =================================================
                         DETALJI GRANTA
                         ================================================= -->


                    <div
                        style="
                            margin-top:20px;
                            padding-top:18px;
                            border-top:1px solid #e5e7eb;
                        "
                    >


                        <div class="meta-row">

                            👤

                            <strong>
                                Ko može aplicirati:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.KO_MOZE_APLICIRATI ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            🎯

                            <strong>
                                Šta se finansira:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.STA_SE_FINANSIRA ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            💰

                            <strong>
                                Iznos podrške:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.IZNOS_PODRSKE ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            🤝

                            <strong>
                                Sufinansiranje:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.SUFINANSIRANJE ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            📋

                            <strong>
                                Projekat:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.PROJEKAT ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            📎

                            <strong>
                                Potrebna dokumentacija:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.POTREBNA_DOKUMENTACIJA ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                    </div>


                    <!-- =================================================
                         DOKUMENTI
                         ================================================= -->


                    ${DOKUMENTI_HTML}


                    <div class="source">

                        Izvor:

                        ${SIGURAN_TEKST(
                            GRANT.IZVOR ||
                            "DocBizHub"
                        )}

                    </div>


                </div>

            `;


            /* =================================================
               META ELEMENT
               ================================================= */


            const META =
                CARD.querySelector(
                    ".meta"
                );


            /* =================================================
               URL GRANTA
               ================================================= */


            const VRIJEDNOST_URL =
                GRANT.URL ??
                GRANT.url ??
                GRANT["URL"] ??
                "";


            console.log(
                "GRANT URL:",
                GRANT.NASLOV,
                VRIJEDNOST_URL
            );


            const IZVOR_URL =
                SIGURAN_URL(
                    VRIJEDNOST_URL
                );


            /* =================================================
               AKO URL GRANTA POSTOJI
               ================================================= */


            if (
                IZVOR_URL
            ) {

                const LINK =
                    document.createElement(
                        "a"
                    );


                LINK.href =
                    IZVOR_URL;


                LINK.target =
                    "_blank";


                LINK.rel =
                    "noopener noreferrer";


                LINK.className =
                    "btn";


                LINK.textContent =
                    "Saznaj više →";


                LINK.title =
                    "Otvori originalni javni poziv";


                const SOURCE =
                    META.querySelector(
                        ".source"
                    );


                META.insertBefore(
                    LINK,
                    SOURCE
                );

            }


            /* =================================================
               AKO URL GRANTA NE POSTOJI
               ================================================= */


            else {

                const LINK =
                    document.createElement(
                        "span"
                    );


                LINK.className =
                    "btn btn-disabled";


                LINK.textContent =
                    "Link nije dostupan";


                LINK.title =
                    "Za ovaj grant trenutno nema ispravnog URL-a";


                const SOURCE =
                    META.querySelector(
                        ".source"
                    );


                META.insertBefore(
                    LINK,
                    SOURCE
                );


                console.warn(
                    "GRANT NEMA ISPRAVAN URL:",
                    GRANT
                );

            }


            /* =================================================
               DODAJ CARD
               ================================================= */


            GRID.appendChild(
                CARD
            );

        }
    );

}


/* =========================================================
   PRETRAGA
   ========================================================= */


document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        PRIKAZI_GRANTOVE
    );


/* =========================================================
   FILTER KATEGORIJE
   ========================================================= */


document
    .getElementById(
        "categoryFilter"
    )
    .addEventListener(
        "change",
        PRIKAZI_GRANTOVE
    );


/* =========================================================
   FILTER STATUSA
   ========================================================= */


document
    .getElementById(
        "statusFilter"
    )
    .addEventListener(
        "change",
        PRIKAZI_GRANTOVE
    );


/* =========================================================
   START APLIKACIJE
   ========================================================= */


UCITAJ_SVE();


</script>


</body>
</html>
