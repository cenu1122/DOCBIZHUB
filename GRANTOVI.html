<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocBizHub — Grantovi & Fondovi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            color: #111827;
        }

        .back-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .hero {
            margin-bottom: 25px;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: 34px;
            color: #111827;
        }

        .hero p {
            margin: 0;
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
        }

        .filters {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 22px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
        }

        .filter-input,
        .filter-select {
            width: 100%;
            min-height: 46px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 14px;
            background: #ffffff;
            color: #111827;
            font-size: 15px;
            outline: none;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .result-info {
            margin: 0 0 15px;
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
        }

        .grant-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .grant-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .grant-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .grant-icon {
            font-size: 30px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-expired {
            background: #fee2e2;
            color: #991b1b;
        }

        .grant-card h2 {
            margin: 0 0 10px;
            color: #111827;
            font-size: 22px;
            line-height: 1.35;
        }

        .grant-description {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .meta-list {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
        }

        .meta-item {
            color: #374151;
            line-height: 1.5;
            font-size: 14px;
        }

        .meta-label {
            font-weight: 800;
        }

        .details {
            border-top: 1px solid #eef0f3;
            padding-top: 16px;
            display: grid;
            gap: 14px;
        }

        .detail-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 13px 14px;
        }

        .detail-title {
            font-weight: 800;
            color: #111827;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .detail-text {
            color: #4b5563;
            line-height: 1.55;
            font-size: 14px;
            white-space: pre-line;
        }

        .source-box {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #eef0f3;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }

        .source-label {
            font-weight: 800;
            color: #374151;
        }

        .original-link {
            display: inline-flex;
            margin-top: 14px;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 44px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            transition: 0.2s ease;
        }

        .original-link:hover {
            background: #1d4ed8;
        }

        /* ================================
           DOKUMENTI
           ================================ */

        .documents-box {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #eef0f3;
        }

        .documents-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .documents-title {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
            color: #111827;
        }

        .documents-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
            padding: 0 8px;
            border-radius: 999px;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 12px;
            font-weight: 800;
        }

        .documents-list {
            display: grid;
            gap: 10px;
        }

        .document-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            transition: 0.2s ease;
        }

        .document-link:hover {
            border-color: #93c5fd;
            background: #eff6ff;
            transform: translateY(-1px);
        }

        .document-left {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            min-width: 0;
        }

        .document-icon {
            flex: 0 0 auto;
            font-size: 22px;
            line-height: 1;
        }

        .document-content {
            min-width: 0;
        }

        .document-name {
            font-weight: 800;
            color: #1f2937;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .document-type {
            display: inline-block;
            margin-top: 4px;
            color: #2563eb;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .document-description {
            margin-top: 4px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.45;
        }

        .document-arrow {
            flex: 0 0 auto;
            font-size: 18px;
            color: #2563eb;
            font-weight: 800;
        }

        .loading,
        .empty {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            color: #6b7280;
        }

        .empty {
            display: none;
        }

        footer {
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
            padding: 25px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 850px) {
            .grant-grid {
                grid-template-columns: 1fr;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 22px 12px 45px;
            }

            header {
                padding: 15px 12px;
            }

            .header-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .hero h1 {
                font-size: 28px;
            }

            .grant-card {
                padding: 17px;
            }

            .grant-card h2 {
                font-size: 20px;
            }

            .document-link {
                padding: 11px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="brand">📊 DocBizHub</div>

        <a
            class="back-link"
            href="https://docbizhub.com/DASHBOARD.html"
        >
            ← Nazad na Dashboard
        </a>
    </div>
</header>

<main>

    <section class="hero">
        <h1>💰 Grantovi &amp; Fondovi</h1>

        <p>
            Pronađite dostupne grantove, fondove, javne pozive i programe podrške
            za razvoj poslovanja.
        </p>
    </section>

    <section class="filters">

        <div class="filter-grid">

            <input
                id="search"
                class="filter-input"
                type="search"
                placeholder="🔎 Pretraži grantove..."
                autocomplete="off"
            >

            <select id="categoryFilter" class="filter-select">
                <option value="">📁 Sve kategorije</option>
                <option value="FEDERALNI">Federalni</option>
                <option value="POLJOPRIVREDA">Poljoprivreda</option>
                <option value="KANTONALNI">Kanton Sarajevo</option>
            </select>

            <select id="statusFilter" class="filter-select">
                <option value="AKTIVAN">🟢 Aktivni</option>
                <option value="ISTEKAO">🔴 Istekli</option>
                <option value="SVE">⚪ Svi</option>
            </select>

        </div>

    </section>

    <div id="resultInfo" class="result-info">
        Učitavanje...
    </div>

    <div id="loading" class="loading">
        Učitavanje grantova...
    </div>

    <div id="empty" class="empty">
        Nema grantova koji odgovaraju odabranim filterima.
    </div>

    <section id="grantGrid" class="grant-grid"></section>

</main>

<footer>
    © 2026 DocBizHub — Grantovi &amp; Fondovi
</footer>

<script>
    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
        "https://uduwpvdjmanrgpumdrfh.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_IfX6dxz-ILfYK_3VgelcMw_tYOX0y45";


    /* =========================================================
       GLOBALNI PODACI
       ========================================================= */

    let SVI_GRANTOVI = [];

    let SVI_DOKUMENTI = [];

    let DOKUMENTI_PO_GRANTU = {};



    /* =========================================================
       SIGURAN URL
       ========================================================= */

    function SIGURAN_URL(VRIJEDNOST) {

        if (!VRIJEDNOST) {
            return null;
        }

        try {

            const URL_OBJEKAT =
                new URL(String(VRIJEDNOST).trim());

            if (
                URL_OBJEKAT.protocol === "http:" ||
                URL_OBJEKAT.protocol === "https:"
            ) {
                return URL_OBJEKAT.href;
            }

            return null;

        } catch (GRESKA) {

            return null;
        }
    }



    /* =========================================================
       SIGURAN TEKST
       ========================================================= */

    function SIGURAN_TEKST(VRIJEDNOST) {

        if (
            VRIJEDNOST === null ||
            VRIJEDNOST === undefined
        ) {
            return "";
        }

        return String(VRIJEDNOST)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }



    /* =========================================================
       TIP DOKUMENTA
       ========================================================= */

    function NORMALIZUJ_TIP_DOKUMENTA(TIP) {

        return String(TIP || "")
            .trim()
            .toUpperCase();
    }



    function IKONA_DOKUMENTA(TIP) {

        const NORMALIZOVANI_TIP =
            NORMALIZUJ_TIP_DOKUMENTA(TIP);

        if (NORMALIZOVANI_TIP === "JAVNI_POZIV") {
            return "📄";
        }

        if (NORMALIZOVANI_TIP === "PRAVILNIK") {
            return "📋";
        }

        if (NORMALIZOVANI_TIP === "PROGRAM") {
            return "📘";
        }

        if (NORMALIZOVANI_TIP === "OBRAZAC") {
            return "📝";
        }

        if (NORMALIZOVANI_TIP === "VODIC") {
            return "📕";
        }

        if (NORMALIZOVANI_TIP === "UGOVOR") {
            return "📜";
        }

        if (NORMALIZOVANI_TIP === "PDF") {
            return "📕";
        }

        return "📎";
    }



    function NAZIV_TIPA_DOKUMENTA(TIP) {

        const NORMALIZOVANI_TIP =
            NORMALIZUJ_TIP_DOKUMENTA(TIP);

        const TIPOVI = {

            "JAVNI_POZIV": "Javni poziv",

            "PRAVILNIK": "Pravilnik",

            "PROGRAM": "Program",

            "OBRAZAC": "Obrazac",

            "VODIC": "Vodič",

            "UGOVOR": "Ugovor",

            "PDF": "PDF dokument"
        };

        return (
            TIPOVI[NORMALIZOVANI_TIP] ||
            TIP ||
            "Dokument"
        );
    }



    /* =========================================================
       UČITAJ GRANTOVE
       ========================================================= */

    async function UCITAJ_GRANTOVE() {

        const URL =
            `${SUPABASE_URL}/rest/v1/GRANTOVI?select=*&order=ROK.asc.nullslast,DATUM_OBJAVE.desc`;

        try {

            const ODGOVOR =
                await fetch(URL, {

                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json"
                    }
                });

            if (!ODGOVOR.ok) {

                const TEKST =
                    await ODGOVOR.text();

                throw new Error(
                    `GRANTOVI ${ODGOVOR.status}: ${TEKST}`
                );
            }

            const PODACI =
                await ODGOVOR.json();

            SVI_GRANTOVI =
                Array.isArray(PODACI)
                    ? PODACI
                    : [];

        } catch (GRESKA) {

            console.error(
                "Greška pri učitavanju grantova:",
                GRESKA
            );

            SVI_GRANTOVI = [];

            throw GRESKA;
        }
    }



    /* =========================================================
       UČITAJ DOKUMENTE
       ========================================================= */

    async function UCITAJ_DOKUMENTE() {

        /*
         * NAMJERNO koristimo select=*.
         *
         * Tako ne zavisimo od pojedinačnih naziva kolona
         * u query parametrima.
         *
         * Nakon toga dokumente filtriramo u JavaScriptu.
         */

        const URL =
            `${SUPABASE_URL}/rest/v1/GRANT_DOKUMENTI?select=*`;

        try {

            const ODGOVOR =
                await fetch(URL, {

                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json"
                    }
                });

            if (!ODGOVOR.ok) {

                const TEKST =
                    await ODGOVOR.text();

                throw new Error(
                    `GRANT_DOKUMENTI ${ODGOVOR.status}: ${TEKST}`
                );
            }

            const PODACI =
                await ODGOVOR.json();

            SVI_DOKUMENTI =
                Array.isArray(PODACI)
                    ? PODACI
                    : [];

            /*
             * Reset mape.
             */

            DOKUMENTI_PO_GRANTU = {};

            /*
             * Grupisanje dokumenata po GRANT_ID.
             */

            SVI_DOKUMENTI.forEach(DOKUMENT => {

                if (!DOKUMENT) {
                    return;
                }

                /*
                 * Prikazujemo samo aktivne dokumente.
                 */

                if (DOKUMENT.AKTIVAN !== true) {
                    return;
                }

                const GRANT_ID =
                    String(DOKUMENT.GRANT_ID);

                if (!GRANT_ID || GRANT_ID === "undefined") {
                    return;
                }

                if (!DOKUMENTI_PO_GRANTU[GRANT_ID]) {

                    DOKUMENTI_PO_GRANTU[GRANT_ID] = [];
                }

                DOKUMENTI_PO_GRANTU[GRANT_ID]
                    .push(DOKUMENT);
            });


            /*
             * Sortiranje:
             *
             * 1. REDOSLIJED
             * 2. ID
             */

            Object.keys(DOKUMENTI_PO_GRANTU)
                .forEach(GRANT_ID => {

                    DOKUMENTI_PO_GRANTU[GRANT_ID]
                        .sort((A, B) => {

                            const REDOSLIJED_A =
                                Number(A.REDOSLIJED ?? 999999);

                            const REDOSLIJED_B =
                                Number(B.REDOSLIJED ?? 999999);

                            if (
                                REDOSLIJED_A !==
                                REDOSLIJED_B
                            ) {
                                return (
                                    REDOSLIJED_A -
                                    REDOSLIJED_B
                                );
                            }

                            return (
                                Number(A.ID ?? 0) -
                                Number(B.ID ?? 0)
                            );
                        });
                });


            console.log(
                "Učitani dokumenti:",
                SVI_DOKUMENTI.length
            );

            console.log(
                "Dokumenti po grantu:",
                DOKUMENTI_PO_GRANTU
            );

        } catch (GRESKA) {

            console.error(
                "Greška pri učitavanju dokumenata:",
                GRESKA
            );

            SVI_DOKUMENTI = [];

            DOKUMENTI_PO_GRANTU = {};

            throw GRESKA;
        }
    }



    /* =========================================================
       UČITAJ SVE
       ========================================================= */

    async function UCITAJ_SVE() {

        const LOADING =
            document.getElementById("loading");

        try {

            await Promise.all([
                UCITAJ_GRANTOVE(),
                UCITAJ_DOKUMENTE()
            ]);

            LOADING.style.display = "none";

            PRIKAZI_GRANTOVE();

        } catch (GRESKA) {

            console.error(
                "Greška pri učitavanju podataka:",
                GRESKA
            );

            LOADING.style.display = "block";

            LOADING.innerHTML = `
                <strong>Greška pri učitavanju podataka.</strong>
                <br><br>
                Otvori Developer Console u browseru
                da vidiš detalj greške.
            `;

            document.getElementById("resultInfo")
                .textContent =
                "Greška pri učitavanju podataka.";
        }
    }



    /* =========================================================
       DATUM
       ========================================================= */

    function FORMATIRAJ_DATUM(DATUM) {

        if (!DATUM) {
            return "Nije navedeno";
        }

        try {

            const DATUM_OBJEKAT =
                new Date(DATUM);

            if (Number.isNaN(DATUM_OBJEKAT.getTime())) {
                return SIGURAN_TEKST(DATUM);
            }

            return DATUM_OBJEKAT
                .toISOString()
                .slice(0, 10);

        } catch (GRESKA) {

            return SIGURAN_TEKST(DATUM);
        }
    }



    /* =========================================================
       DOKUMENTI HTML
       ========================================================= */

    function NAPRAVI_DOKUMENTE_HTML(GRANT_ID) {

        const KLJUC =
            String(GRANT_ID);

        const DOKUMENTI =
            DOKUMENTI_PO_GRANTU[KLJUC] || [];

        /*
         * Ako nema dokumenata,
         * ne prikazujemo praznu kutiju.
         */

        if (!DOKUMENTI.length) {
            return "";
        }


        const VALIDNI_DOKUMENTI =
            DOKUMENTI.filter(DOKUMENT => {

                const SIGURAN_LINK =
                    SIGURAN_URL(DOKUMENT.URL);

                return Boolean(SIGURAN_LINK);
            });


        if (!VALIDNI_DOKUMENTI.length) {
            return "";
        }


        const DOKUMENTI_HTML =
            VALIDNI_DOKUMENTI
                .map(DOKUMENT => {

                    const LINK =
                        SIGURAN_URL(DOKUMENT.URL);

                    const NAZIV =
                        SIGURAN_TEKST(
                            DOKUMENT.NAZIV ||
                            "Dokument"
                        );

                    const TIP =
                        SIGURAN_TEKST(
                            NAZIV_TIPA_DOKUMENTA(
                                DOKUMENT.TIP_DOKUMENTA
                            )
                        );

                    const IKONA =
                        IKONA_DOKUMENTA(
                            DOKUMENT.TIP_DOKUMENTA
                        );

                    const OPIS =
                        SIGURAN_TEKST(
                            DOKUMENT.OPIS || ""
                        );

                    return `
                        <a
                            class="document-link"
                            href="${SIGURAN_TEKST(LINK)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            title="Otvori dokument"
                        >

                            <div class="document-left">

                                <div class="document-icon">
                                    ${IKONA}
                                </div>

                                <div class="document-content">

                                    <div class="document-name">
                                        ${NAZIV}
                                    </div>

                                    <div class="document-type">
                                        ${TIP}
                                    </div>

                                    ${
                                        OPIS
                                            ? `
                                                <div class="document-description">
                                                    ${OPIS}
                                                </div>
                                              `
                                            : ""
                                    }

                                </div>

                            </div>

                            <div class="document-arrow">
                                →
                            </div>

                        </a>
                    `;
                })
                .join("");


        return `
            <div class="documents-box">

                <div class="documents-header">

                    <h3 class="documents-title">
                        📎 Dokumenti
                    </h3>

                    <span class="documents-count">
                        ${VALIDNI_DOKUMENTI.length}
                    </span>

                </div>

                <div class="documents-list">
                    ${DOKUMENTI_HTML}
                </div>

            </div>
        `;
    }



    /* =========================================================
       STATUS
       ========================================================= */

    function NORMALIZUJ_STATUS(GRANT) {

        const STATUS =
            String(GRANT.STATUS || "")
                .trim()
                .toUpperCase();

        if (STATUS === "AKTIVAN") {
            return "AKTIVAN";
        }

        if (STATUS === "ISTEKAO") {
            return "ISTEKAO";
        }

        /*
         * Ako STATUS nije popunjen,
         * pokušavamo preko roka.
         */

        if (GRANT.ROK) {

            const ROK =
                new Date(GRANT.ROK);

            if (
                !Number.isNaN(ROK.getTime()) &&
                ROK < new Date()
            ) {
                return "ISTEKAO";
            }
        }

        return "AKTIVAN";
    }



    /* =========================================================
       PRIKAZ GRANTOVA
       ========================================================= */

    function PRIKAZI_GRANTOVE() {

        const GRID =
            document.getElementById("grantGrid");

        const EMPTY =
            document.getElementById("empty");

        const RESULT_INFO =
            document.getElementById("resultInfo");

        const SEARCH =
            document.getElementById("search")
                .value
                .trim()
                .toLowerCase();

        const KATEGORIJA =
            document.getElementById("categoryFilter")
                .value
                .trim()
                .toUpperCase();

        const STATUS_FILTER =
            document.getElementById("statusFilter")
                .value
                .trim()
                .toUpperCase();


        const FILTRIRANI =
            SVI_GRANTOVI.filter(GRANT => {

                const STATUS =
                    NORMALIZUJ_STATUS(GRANT);

                const TEKST =
                    [
                        GRANT.NASLOV,
                        GRANT.OPIS,
                        GRANT.KATEGORIJA,
                        GRANT.INSTITUCIJA,
                        GRANT.IZVOR,
                        GRANT.KO_MOZE_APLICIRATI,
                        GRANT.STA_SE_FINANSIRA,
                        GRANT.IZNOS_PODRSKE,
                        GRANT.SUFINANSIRANJE,
                        GRANT.PROJEKAT,
                        GRANT.POTREBNA_DOKUMENTACIJA
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                const ODGOVARA_PRETRAZI =
                    !SEARCH ||
                    TEKST.includes(SEARCH);


                const ODGOVARA_KATEGORIJI =
                    !KATEGORIJA ||
                    String(GRANT.KATEGORIJA || "")
                        .trim()
                        .toUpperCase() === KATEGORIJA;


                const ODGOVARA_STATUSU =
                    STATUS_FILTER === "SVE" ||
                    STATUS === STATUS_FILTER;


                return (
                    ODGOVARA_PRETRAZI &&
                    ODGOVARA_KATEGORIJI &&
                    ODGOVARA_STATUSU
                );
            });


        RESULT_INFO.textContent =
            `Prikazano ${FILTRIRANI.length} ` +
            `${
                FILTRIRANI.length === 1
                    ? "aktivnog granta"
                    : "aktivnih grantova"
            }.`;



        if (!FILTRIRANI.length) {

            GRID.innerHTML = "";

            EMPTY.style.display = "block";

            return;
        }


        EMPTY.style.display = "none";


        GRID.innerHTML =
            FILTRIRANI
                .map(GRANT => {

                    const STATUS =
                        NORMALIZUJ_STATUS(GRANT);

                    const JE_AKTIVAN =
                        STATUS === "AKTIVAN";

                    const STATUS_TEXT =
                        JE_AKTIVAN
                            ? "Aktivan"
                            : "Istekao";

                    const STATUS_CLASS =
                        JE_AKTIVAN
                            ? "status-active"
                            : "status-expired";


                    const ORIGINALNI_URL =
                        SIGURAN_URL(GRANT.URL);


                    const DOKUMENTI_HTML =
                        NAPRAVI_DOKUMENTE_HTML(
                            GRANT.ID
                        );


                    return `
                        <article class="grant-card">

                            <div class="grant-top">

                                <div class="grant-icon">
                                    💰
                                </div>

                                <span
                                    class="status-badge ${STATUS_CLASS}"
                                >
                                    ${JE_AKTIVAN ? "🟢" : "🔴"}
                                    ${STATUS_TEXT}
                                </span>

                            </div>


                            <h2>
                                ${SIGURAN_TEKST(
                                    GRANT.NASLOV ||
                                    "Grant bez naslova"
                                )}
                            </h2>


                            ${
                                GRANT.OPIS
                                    ? `
                                        <div class="grant-description">
                                            ${SIGURAN_TEKST(
                                                GRANT.OPIS
                                            )}
                                        </div>
                                      `
                                    : ""
                            }


                            <div class="meta-list">

                                <div class="meta-item">
                                    📁
                                    <span class="meta-label">
                                        Kategorija:
                                    </span>
                                    ${SIGURAN_TEKST(
                                        GRANT.KATEGORIJA ||
                                        "Nije navedeno"
                                    )}
                                </div>

                                <div class="meta-item">
                                    🏛️
                                    <span class="meta-label">
                                        Institucija:
                                    </span>
                                    ${SIGURAN_TEKST(
                                        GRANT.INSTITUCIJA ||
                                        "Nije navedeno"
                                    )}
                                </div>

                                <div class="meta-item">
                                    📅
                                    <span class="meta-label">
                                        Objavljeno:
                                    </span>
                                    ${FORMATIRAJ_DATUM(
                                        GRANT.DATUM_OBJAVE
                                    )}
                                </div>

                                <div class="meta-item">
                                    ⏰
                                    <span class="meta-label">
                                        Rok:
                                    </span>
                                    ${
                                        GRANT.ROK
                                            ? FORMATIRAJ_DATUM(
                                                GRANT.ROK
                                              )
                                            : "Nije navedeno"
                                    }
                                </div>

                            </div>


                            <div class="details">

                                <div class="detail-box">

                                    <div class="detail-title">
                                        👤 Ko može aplicirati:
                                    </div>

                                    <div class="detail-text">
                                        ${SIGURAN_TEKST(
                                            GRANT.KO_MOZE_APLICIRATI ||
                                            "Nije navedeno."
                                        )}
                                    </div>

                                </div>


                                <div class="detail-box">

                                    <div class="detail-title">
                                        🎯 Šta se finansira:
                                    </div>

                                    <div class="detail-text">
                                        ${SIGURAN_TEKST(
                                            GRANT.STA_SE_FINANSIRA ||
                                            "Nije navedeno."
                                        )}
                                    </div>

                                </div>


                                <div class="detail-box">

                                    <div class="detail-title">
                                        💰 Iznos podrške:
                                    </div>

                                    <div class="detail-text">
                                        ${SIGURAN_TEKST(
                                            GRANT.IZNOS_PODRSKE ||
                                            "Nije navedeno."
                                        )}
                                    </div>

                                </div>


                                <div class="detail-box">

                                    <div class="detail-title">
                                        🤝 Sufinansiranje:
                                    </div>

                                    <div class="detail-text">
                                        ${SIGURAN_TEKST(
                                            GRANT.SUFINANSIRANJE ||
                                            "Nije navedeno."
                                        )}
                                    </div>

                                </div>


                                <div class="detail-box">

                                    <div class="detail-title">
                                        📋 Projekat:
                                    </div>

                                    <div class="detail-text">
                                        ${SIGURAN_TEKST(
                                            GRANT.PROJEKAT ||
                                            "Nije navedeno."
                                        )}
                                    </div>

                                </div>


                                <div class="detail-box">

                                    <div class="detail-title">
                                        📎 Potrebna dokumentacija:
                                    </div>

                                    <div class="detail-text">
                                        ${SIGURAN_TEKST(
                                            GRANT.POTREBNA_DOKUMENTACIJA ||
                                            "Nije navedeno."
                                        )}
                                    </div>

                                </div>

                            </div>


                            ${DOKUMENTI_HTML}


                            ${
                                ORIGINALNI_URL
                                    ? `
                                        <a
                                            class="original-link"
                                            href="${SIGURAN_TEKST(
                                                ORIGINALNI_URL
                                            )}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            title="Otvori originalni javni poziv"
                                        >
                                            Saznaj više →
                                        </a>
                                      `
                                    : ""
                            }


                            ${
                                GRANT.IZVOR
                                    ? `
                                        <div class="source-box">
                                            <span class="source-label">
                                                Izvor:
                                            </span>
                                            ${SIGURAN_TEKST(
                                                GRANT.IZVOR
                                            )}
                                        </div>
                                      `
                                    : ""
                            }

                        </article>
                    `;
                })
                .join("");
    }



    /* =========================================================
       FILTERI
       ========================================================= */

    document
        .getElementById("search")
        .addEventListener(
            "input",
            PRIKAZI_GRANTOVE
        );


    document
        .getElementById("categoryFilter")
        .addEventListener(
            "change",
            PRIKAZI_GRANTOVE
        );


    document
        .getElementById("statusFilter")
        .addEventListener(
            "change",
            PRIKAZI_GRANTOVE
        );



    /* =========================================================
       START
       ========================================================= */

    UCITAJ_SVE();

</script>

</body>
</html>
