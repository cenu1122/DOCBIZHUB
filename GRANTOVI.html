<!DOCTYPE html>
<html lang="bs">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grantovi & Fondovi | DocBizHub</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;
            color: #1f2937;
        }


        .header {
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a5f
                );

            color: white;

            padding: 22px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.12);
        }


        .logo {
            font-size: 24px;
            font-weight: 700;
        }


        .back-btn {
            color: white;
            text-decoration: none;

            background:
                rgba(255,255,255,0.12);

            padding: 10px 16px;

            border-radius: 10px;

            transition: 0.2s;

            white-space: nowrap;
        }


        .back-btn:hover {
            background:
                rgba(255,255,255,0.22);
        }


        .container {
            max-width: 1200px;

            margin: 35px auto;

            padding: 0 20px;
        }


        .hero {
            background: white;

            border-radius: 18px;

            padding: 35px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }


        .hero h1 {
            font-size: 32px;

            margin-bottom: 10px;

            color: #0f172a;
        }


        .hero p {
            color: #64748b;

            font-size: 16px;

            line-height: 1.6;
        }


        .filters {
            display: grid;

            grid-template-columns:
                1fr 220px 220px;

            gap: 12px;

            margin-top: 22px;
        }


        .search-box input,
        .filter-select {

            width: 100%;

            padding: 15px 18px;

            border:
                1px solid #dbe2ea;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            background: white;
        }


        .search-box input:focus,
        .filter-select:focus {

            border-color: #2563eb;
        }


        .result-info {

            margin-top: 15px;

            color: #64748b;

            font-size: 14px;
        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 20px;
        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.06);

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            border:
                1px solid #edf1f5;

            display: flex;

            flex-direction: column;
        }


        .card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.10);
        }


        .icon {

            font-size: 35px;

            margin-bottom: 15px;
        }


        .card h2 {

            font-size: 20px;

            margin-bottom: 12px;

            color: #0f172a;

            line-height: 1.4;
        }


        .card p {

            color: #64748b;

            line-height: 1.5;

            margin-bottom: 12px;
        }


        .meta {

            margin-top: auto;

            padding-top: 10px;
        }


        .meta-row {

            font-size: 13px;

            color: #64748b;

            margin-bottom: 8px;

            line-height: 1.5;
        }


        .status {

            display: inline-block;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 14px;
        }


        .status-aktivan {

            background: #dcfce7;

            color: #166534;
        }


        .status-istekao {

            background: #fee2e2;

            color: #991b1b;
        }


        .status-zatvoren {

            background: #e2e8f0;

            color: #475569;
        }


        .btn {

            display: inline-block;

            text-decoration: none;

            background: #2563eb;

            color: white;

            padding: 11px 16px;

            border-radius: 9px;

            font-weight: 600;

            transition: 0.2s;

            margin-top: 8px;

            cursor: pointer;
        }


        .btn:hover {

            background: #1d4ed8;
        }


        .btn-disabled {

            background: #94a3b8;

            cursor: not-allowed;

            pointer-events: none;
        }


        .source {

            font-size: 12px;

            color: #94a3b8;

            margin-top: 12px;
        }


        .empty {

            display: none;

            text-align: center;

            padding: 45px 20px;

            color: #64748b;

            background: white;

            border-radius: 16px;

            margin-top: 20px;
        }


        .error {

            grid-column: 1 / -1;

            text-align: center;

            padding: 45px 20px;

            color: #dc2626;

            background: white;

            border-radius: 16px;
        }


        .loading {

            grid-column: 1 / -1;

            text-align: center;

            padding: 45px 20px;

            color: #64748b;

            background: white;

            border-radius: 16px;
        }


        .footer {

            text-align: center;

            padding: 35px 20px;

            color: #94a3b8;

            font-size: 14px;
        }


        @media (max-width: 850px) {

            .filters {

                grid-template-columns:
                    1fr 1fr;

            }

            .search-box {

                grid-column:
                    1 / -1;

            }

        }


        @media (max-width: 700px) {

            .header {

                padding: 18px;

                flex-direction: column;

                align-items: stretch;
            }


            .back-btn {

                text-align: center;
            }


            .hero {

                padding: 25px;
            }


            .hero h1 {

                font-size: 26px;
            }


            .filters {

                grid-template-columns: 1fr;
            }


            .search-box {

                grid-column: auto;
            }


            .grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">
        📊 DocBizHub
    </div>


    <a
        href="DASHBOARD.html"
        class="back-btn"
    >
        ← Nazad na Dashboard
    </a>

</header>


<main class="container">


    <section class="hero">

        <h1>
            💰 Grantovi & Fondovi
        </h1>


        <p>
            Pronađite dostupne grantove,
            fondove, javne pozive i programe
            podrške za razvoj poslovanja.
        </p>


        <div class="filters">


            <!-- PRETRAGA -->

            <div class="search-box">

                <input
                    type="search"
                    id="search"
                    name="grant_search"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="none"
                    spellcheck="false"
                    inputmode="search"
                    placeholder="🔎 Pretraži grantove, institucije..."
                >

            </div>


            <!-- KATEGORIJA -->

            <select
                id="categoryFilter"
                name="grant_category"
                class="filter-select"
                autocomplete="off"
            >

                <option value="">
                    📁 Sve kategorije
                </option>

                <option value="FEDERALNI">
                    Federalni
                </option>

                <option value="POLJOPRIVREDA">
                    Poljoprivreda
                </option>

                <option value="KANTONALNI">
                    Kanton Sarajevo
                </option>

            </select>


            <!-- STATUS -->

            <select
                id="statusFilter"
                name="grant_status"
                class="filter-select"
                autocomplete="off"
            >

                <option value="AKTIVAN">
                    🟢 Aktivni
                </option>

                <option value="ISTEKAO">
                    🔴 Istekli
                </option>

                <option value="SVE">
                    ⚪ Svi
                </option>

            </select>


        </div>


        <div
            class="result-info"
            id="resultInfo"
        >
            Učitavanje...
        </div>

    </section>


    <section
        class="grid"
        id="grantGrid"
    >

        <div
            class="loading"
            id="loading"
        >
            ⏳ Učitavanje grantova...
        </div>

    </section>


    <div
        class="empty"
        id="empty"
    >
        Nema rezultata za odabrane filtere.
    </div>


</main>


<footer class="footer">

    © 2026 DocBizHub —
    Grantovi & Fondovi

</footer>

<script>


/* =========================================================
   SUPABASE
   ========================================================= */


const SUPABASE_URL =
    "https://uduwpvdjmanrgpumdrfh.supabase.co";


const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoidWR1d3B2ZGptYW5yZ3B1bWRyZmgiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NDgxMTA4NCwiZXhwIjoyMTAwMzg3MDg0fQ.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ";


/* =========================================================
   SVI GRANTOVI
   ========================================================= */


let SVI_GRANTOVI = [];


/* =========================================================
   SIGURAN TEKST
   ========================================================= */


function SIGURAN_TEKST(TEKST) {

    const DIV =
        document.createElement("div");


    DIV.textContent =
        TEKST === null ||
        TEKST === undefined
            ? ""
            : String(TEKST);


    return DIV.innerHTML;

}


/* =========================================================
   SIGURAN URL
   ========================================================= */


function SIGURAN_URL(URL) {

    if (
        URL === null ||
        URL === undefined
    ) {

        return null;

    }


    const SIROVI_URL =
        String(URL).trim();


    if (!SIROVI_URL) {

        return null;

    }


    try {

        const TEST =
            new URL(
                SIROVI_URL,
                window.location.href
            );


        if (
            TEST.protocol === "http:" ||
            TEST.protocol === "https:"
        ) {

            return TEST.href;

        }

    }

    catch (GRESKA) {

        console.warn(
            "NEISPRAVAN GRANT URL:",
            URL
        );

    }


    return null;

}


/* =========================================================
   DATUM
   ========================================================= */


function FORMAT_DATUMA(DATUM) {

    if (!DATUM) {

        return "Nije navedeno";

    }


    const TEST =
        new Date(DATUM);


    if (
        Number.isNaN(
            TEST.getTime()
        )
    ) {

        return "Nije navedeno";

    }


    return TEST.toLocaleDateString(
        "bs-BA"
    );

}


/* =========================================================
   NORMALIZUJ STATUS
   ========================================================= */


function NORMALIZUJ_STATUS(STATUS) {

    return String(
        STATUS || "AKTIVAN"
    )
        .trim()
        .toUpperCase();

}


/* =========================================================
   STATUS NAZIV
   ========================================================= */


function STATUS_NAZIV(STATUS) {

    const NORMALIZOVANI_STATUS =
        NORMALIZUJ_STATUS(STATUS);


    if (
        NORMALIZOVANI_STATUS ===
        "ISTEKAO"
    ) {

        return "Istekao";

    }


    if (
        NORMALIZOVANI_STATUS ===
        "ZATVOREN"
    ) {

        return "Zatvoren";

    }


    return "Aktivan";

}


/* =========================================================
   STATUS KLASA
   ========================================================= */


function STATUS_KLASA(STATUS) {

    const NORMALIZOVANI_STATUS =
        NORMALIZUJ_STATUS(STATUS);


    if (
        NORMALIZOVANI_STATUS ===
        "ISTEKAO"
    ) {

        return "status-istekao";

    }


    if (
        NORMALIZOVANI_STATUS ===
        "ZATVOREN"
    ) {

        return "status-zatvoren";

    }


    return "status-aktivan";

}


/* =========================================================
   UČITAJ SVE GRANTOVE
   ========================================================= */


async function UCITAJ_GRANTOVE() {

    const GRID =
        document.getElementById(
            "grantGrid"
        );


    const RESULT_INFO =
        document.getElementById(
            "resultInfo"
        );


    try {

        console.log(
            "POČETAK UČITAVANJA GRANTOVA..."
        );


        const URL =
            `${SUPABASE_URL}/rest/v1/GRANTOVI?select=*&order=ROK.asc.nullslast,DATUM_OBJAVE.desc`;


        console.log(
            "SUPABASE URL:",
            URL
        );


        const ODGOVOR =
            await fetch(
                URL,
                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_ANON_KEY}`,

                        "Accept":
                            "application/json"

                    }

                }
            );


        console.log(
            "SUPABASE STATUS:",
            ODGOVOR.status
        );


        if (!ODGOVOR.ok) {

            const TEKST_GRESKE =
                await ODGOVOR.text();


            console.error(
                "SUPABASE GREŠKA:",
                TEKST_GRESKE
            );


            throw new Error(
                `Supabase greška ${ODGOVOR.status}: ${TEKST_GRESKE}`
            );

        }


        const PODACI =
            await ODGOVOR.json();


        console.log(
            "GRANTOVI UČITANI:",
            PODACI
        );


        if (!Array.isArray(PODACI)) {

            throw new Error(
                "Supabase nije vratio niz grantova."
            );

        }


        SVI_GRANTOVI =
            PODACI;


        const LOADING =
            document.getElementById(
                "loading"
            );


        if (LOADING) {

            LOADING.remove();

        }


        PRIKAZI_GRANTOVE();

    }


    catch (GRESKA) {

        console.error(
            "GREŠKA PRI UČITAVANJU GRANTOVA:",
            GRESKA
        );


        if (GRID) {

            GRID.innerHTML = `

                <div class="error">

                    ❌ Grantovi trenutno nisu dostupni.

                    <br><br>

                    ${SIGURAN_TEKST(
                        GRESKA.message ||
                        "Nepoznata greška."
                    )}

                </div>

            `;

        }


        if (RESULT_INFO) {

            RESULT_INFO.textContent =
                "Greška pri učitavanju grantova.";

        }

    }

}


/* =========================================================
   PRIKAŽI GRANTOVE
   ========================================================= */


function PRIKAZI_GRANTOVE() {

    const GRID =
        document.getElementById(
            "grantGrid"
        );


    const EMPTY =
        document.getElementById(
            "empty"
        );


    const RESULT_INFO =
        document.getElementById(
            "resultInfo"
        );


    const SEARCH_ELEMENT =
        document.getElementById(
            "search"
        );


    const CATEGORY_ELEMENT =
        document.getElementById(
            "categoryFilter"
        );


    const STATUS_ELEMENT =
        document.getElementById(
            "statusFilter"
        );


    const SEARCH =
        SEARCH_ELEMENT
            ? SEARCH_ELEMENT.value
                .trim()
                .toLowerCase()
            : "";


    const KATEGORIJA =
        CATEGORY_ELEMENT
            ? CATEGORY_ELEMENT.value
            : "";


    const STATUS_FILTER =
        STATUS_ELEMENT
            ? STATUS_ELEMENT.value
            : "AKTIVAN";


    /* =========================================================
       FILTRIRANJE
       ========================================================= */


    const FILTRIRANI =
        SVI_GRANTOVI.filter(
            GRANT => {

                /* -----------------------------------------
                   PRETRAGA
                   ----------------------------------------- */


                const TEKST = [

                    GRANT.NASLOV,

                    GRANT.OPIS,

                    GRANT.KATEGORIJA,

                    GRANT.INSTITUCIJA,

                    GRANT.IZVOR,

                    GRANT.KO_MOZE_APLICIRATI,

                    GRANT.STA_SE_FINANSIRA,

                    GRANT.IZNOS_PODRSKE,

                    GRANT.SUFINANSIRANJE,

                    GRANT.PROJEKAT,

                    GRANT.POTREBNA_DOKUMENTACIJA

                ]
                    .filter(
                        VRIJEDNOST =>
                            VRIJEDNOST !== null &&
                            VRIJEDNOST !== undefined
                    )
                    .join(" ")
                    .toLowerCase();


                const ODGOVARA_PRETRAZI =
                    !SEARCH ||
                    TEKST.includes(
                        SEARCH
                    );


                /* -----------------------------------------
                   KATEGORIJA
                   ----------------------------------------- */


                const GRANT_KATEGORIJA =
                    String(
                        GRANT.KATEGORIJA || ""
                    )
                        .trim()
                        .toUpperCase();


                const FILTER_KATEGORIJA =
                    String(
                        KATEGORIJA || ""
                    )
                        .trim()
                        .toUpperCase();


                const ODGOVARA_KATEGORIJI =
                    !FILTER_KATEGORIJA ||
                    GRANT_KATEGORIJA ===
                        FILTER_KATEGORIJA;


                /* -----------------------------------------
                   STATUS
                   ----------------------------------------- */


                const GRANT_STATUS =
                    NORMALIZUJ_STATUS(
                        GRANT.STATUS
                    );


                const ODGOVARA_STATUSU =
                    STATUS_FILTER === "SVE" ||
                    GRANT_STATUS ===
                        STATUS_FILTER;


                return (
                    ODGOVARA_PRETRAZI &&
                    ODGOVARA_KATEGORIJI &&
                    ODGOVARA_STATUSU
                );

            }
        );


    /* =========================================================
       OBRIŠI STARE CARDOVE
       ========================================================= */


    GRID.innerHTML = "";


    /* =========================================================
       NEMA REZULTATA
       ========================================================= */


    if (
        FILTRIRANI.length === 0
    ) {

        EMPTY.style.display =
            "block";


        RESULT_INFO.textContent =
            "Nema pronađenih grantova.";


        return;

    }


    EMPTY.style.display =
        "none";


    /* =========================================================
       TEKST STATUSA
       ========================================================= */


    let TEKST_STATUSA =
        "svih";


    if (
        STATUS_FILTER ===
        "AKTIVAN"
    ) {

        TEKST_STATUSA =
            "aktivnih";

    }


    if (
        STATUS_FILTER ===
        "ISTEKAO"
    ) {

        TEKST_STATUSA =
            "isteklih";

    }


    if (
        STATUS_FILTER ===
        "ZATVOREN"
    ) {

        TEKST_STATUSA =
            "zatvorenih";

    }


    RESULT_INFO.textContent =
        `Prikazano ${FILTRIRANI.length} ${TEKST_STATUSA} grantova.`;


    /* =========================================================
       KREIRAJ SVAKI CARD
       ========================================================= */


    FILTRIRANI.forEach(
        GRANT => {

            const CARD =
                document.createElement(
                    "article"
                );


            CARD.className =
                "card";


            /* -----------------------------------------
               DATUM
               ----------------------------------------- */


            const DATUM =
                FORMAT_DATUMA(
                    GRANT.DATUM_OBJAVE
                );


            /* -----------------------------------------
               ROK
               ----------------------------------------- */


            const ROK =
                FORMAT_DATUMA(
                    GRANT.ROK
                );


            /* -----------------------------------------
               STATUS
               ----------------------------------------- */


            const STATUS =
                NORMALIZUJ_STATUS(
                    GRANT.STATUS
                );


            /* =================================================
               CARD SADRŽAJ
               ================================================= */


            CARD.innerHTML = `

                <div class="icon">
                    💰
                </div>


                <span
                    class="status ${STATUS_KLASA(STATUS)}"
                >
                    ${STATUS_NAZIV(STATUS)}
                </span>


                <h2>
                    ${SIGURAN_TEKST(
                        GRANT.NASLOV
                    )}
                </h2>


                <p>
                    ${SIGURAN_TEKST(
                        GRANT.OPIS ||
                        "Informacije o javnom pozivu."
                    )}
                </p>


                <div class="meta">


                    <div class="meta-row">

                        📁

                        <strong>
                            Kategorija:
                        </strong>

                        ${SIGURAN_TEKST(
                            GRANT.KATEGORIJA ||
                            "Nije navedeno"
                        )}

                    </div>


                    <div class="meta-row">

                        🏛️

                        <strong>
                            Institucija:
                        </strong>

                        ${SIGURAN_TEKST(
                            GRANT.INSTITUCIJA ||
                            "Nije navedeno"
                        )}

                    </div>


                    <div class="meta-row">

                        📅

                        <strong>
                            Objavljeno:
                        </strong>

                        ${DATUM}

                    </div>


                    <div class="meta-row">

                        ⏰

                        <strong>
                            Rok:
                        </strong>

                        ${ROK}

                    </div>


                    <!-- =================================================
                         DETALJI GRANTA
                         ================================================= -->


                    <div
                        style="
                            margin-top:20px;
                            padding-top:18px;
                            border-top:1px solid #e5e7eb;
                        "
                    >


                        <div class="meta-row">

                            👤

                            <strong>
                                Ko može aplicirati:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.KO_MOZE_APLICIRATI ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            🎯

                            <strong>
                                Šta se finansira:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.STA_SE_FINANSIRA ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            💰

                            <strong>
                                Iznos podrške:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.IZNOS_PODRSKE ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            🤝

                            <strong>
                                Sufinansiranje:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.SUFINANSIRANJE ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            📋

                            <strong>
                                Projekat:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.PROJEKAT ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                        <div class="meta-row">

                            📎

                            <strong>
                                Potrebna dokumentacija:
                            </strong>

                            <div style="margin-top:5px;">

                                ${SIGURAN_TEKST(
                                    GRANT.POTREBNA_DOKUMENTACIJA ||
                                    "Nije navedeno."
                                )}

                            </div>

                        </div>


                    </div>


                    <div class="source">

                        Izvor:

                        ${SIGURAN_TEKST(
                            GRANT.IZVOR ||
                            "DocBizHub"
                        )}

                    </div>


                </div>

            `;


            /* =================================================
               META ELEMENT
               ================================================= */


            const META =
                CARD.querySelector(
                    ".meta"
                );


            /* =================================================
               URL GRANTA
               ================================================= */


            const IZVOR_URL =
                SIGURAN_URL(
                    GRANT.URL
                );


            /* =================================================
               AKO URL POSTOJI
               ================================================= */


            if (
                IZVOR_URL
            ) {

                const LINK =
                    document.createElement(
                        "a"
                    );


                LINK.href =
                    IZVOR_URL;


                LINK.target =
                    "_blank";


                LINK.rel =
                    "noopener noreferrer";


                LINK.className =
                    "btn";


                LINK.textContent =
                    "Saznaj više →";


                LINK.title =
                    "Otvori originalni javni poziv";


                const SOURCE =
                    META.querySelector(
                        ".source"
                    );


                META.insertBefore(
                    LINK,
                    SOURCE
                );

            }


            /* =================================================
               AKO URL NE POSTOJI
               ================================================= */


            else {

                const LINK =
                    document.createElement(
                        "span"
                    );


                LINK.className =
                    "btn btn-disabled";


                LINK.textContent =
                    "Link nije dostupan";


                LINK.title =
                    "Za ovaj grant trenutno nema ispravnog URL-a";


                const SOURCE =
                    META.querySelector(
                        ".source"
                    );


                META.insertBefore(
                    LINK,
                    SOURCE
                );


                console.warn(
                    "GRANT NEMA ISPRAVAN URL:",
                    GRANT
                );

            }


            /* =================================================
               DODAJ CARD NA STRANICU
               ================================================= */


            GRID.appendChild(
                CARD
            );

        }
    );

}


/* =========================================================
   PRETRAGA
   ========================================================= */


document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        PRIKAZI_GRANTOVE
    );

document

    )

document

    )
    .addEventListener(

    );

UCITAJ_GRANTOVE();


</script>
