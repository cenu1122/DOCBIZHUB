
<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glavna pretraga firmi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    color: #222;
}

.container {
    max-width: 950px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 7px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.primary {
    width: 100%;
    background: #1769d2;
    color: white;
    margin-top: 20px;
}

.mic {
    background: #198754;
    color: white;
    width: 100%;
}

.mic.listening {
    background: #dc3545;
}

.secondary {
    background: #e9ecef;
    color: #222;
}

.settings {
    margin-top: 25px;
    padding: 18px;
    background: #f5f7fa;
    border: 1px solid #dce2e8;
    border-radius: 10px;
}

.info {
    padding: 12px;
    background: white;
    border-radius: 8px;
    margin-top: 10px;
    border: 1px solid #e1e5ea;
}

.info small {
    display: block;
    color: #777;
    margin-bottom: 5px;
}

.status {
    margin-top: 12px;
    font-size: 14px;
    color: #555;
}

.results {
    margin-top: 25px;
}

.result-card {
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin: 10px 0;
    overflow-wrap: anywhere;
}

.result-card h3 {
    margin-top: 0;
}

.source {
    padding: 13px;
    background: #e9f5ee;
    border-radius: 8px;
    margin-top: 15px;
}

.error {
    color: #b02a37;
}

.success {
    color: #198754;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>PRETRAGA FIRMI</h1>

<label for="pojam">Šta tražite?</label>
<input id="pojam" placeholder="Npr. aluminijski profili">

<label for="ponuda">Ponuda</label>
<textarea id="ponuda" placeholder="Šta nudite?"></textarea>

<label for="potraznja">Potražnja</label>
<textarea id="potraznja" placeholder="Šta tražite od drugih firmi?"></textarea>

<label for="detalji">Dodatni detalji</label>
<textarea id="detalji" placeholder="Država, grad, djelatnost..."></textarea>


<!-- POSTAVKE MIKROFONA -->

<div class="settings">

<h3>🎙️ POSTAVKE GLASOVNE PRETRAGE</h3>

<div class="info">
    <small>DRŽAVA ZA ODREĐIVANJE JEZIKA</small>
    <strong id="displayCountry">Nije učitana</strong>
    <small id="countrySource">Izvor: nije određen</small>
</div>

<div class="info">
    <small>JEZIK MIKROFONA</small>
    <strong id="displayLanguage">Bosanski</strong>
    <small id="displayLocale">bs-BA</small>
</div>

<label for="languageSelect">Promijeni jezik ručno:</label>

<select id="languageSelect">
    <option value="auto">Automatski prema državi</option>
    <option value="bs-BA">Bosanski</option>
    <option value="hr-HR">Hrvatski</option>
    <option value="sr-RS">Srpski</option>
    <option value="de-DE">Njemački</option>
    <option value="en-US">Engleski (SAD)</option>
    <option value="en-GB">Engleski (UK)</option>
    <option value="fr-FR">Francuski</option>
    <option value="it-IT">Italijanski</option>
    <option value="es-ES">Španski</option>
    <option value="tr-TR">Turski</option>
    <option value="ar-SA">Arapski</option>
    <option value="nl-NL">Holandski</option>
    <option value="pl-PL">Poljski</option>
    <option value="ru-RU">Ruski</option>
    <option value="zh-CN">Kineski</option>
</select>

<p class="status" id="micStatus">
    Mikrofon je spreman.
</p>

<button class="mic" id="micButton" type="button">
    🎙️ POKRENI MIKROFON
</button>

</div>


<button class="primary" id="searchButton" type="button">
    🔍 PRETRAŽI
</button>

<div id="mainStatus" class="status"></div>

<div id="results" class="results hidden">

    <h2>REZULTATI PRETRAGE</h2>

    <div id="sourceInfo" class="source"></div>

    <div id="stats"></div>

    <h3>Firme</h3>
    <div id="companyResults"></div>

    <h3>Potencijalni kupci</h3>
    <div id="buyerResults"></div>

    <h3>Potvrđena potražnja</h3>
    <div id="demandResults"></div>

    <h3>Dobavljači</h3>
    <div id="supplierResults"></div>

    <h3>Oglasi</h3>
    <div id="adResults"></div>

</div>

</div>


<script>

// ============================================
// 1. SUPABASE PODEŠAVANJA
// ============================================

const SUPABASE_URL =
"https://uduwpvdjmanrgpumdrfh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IfX6dxz-ILfYK_3VgelcMw_tYOX0y45";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ============================================
// 2. PODACI O DRŽAVI
// ============================================

// OVE DVIJE VRIJEDNOSTI POVEŽI SA SVOJIM PODACIMA.
// Ako ih već učitavaš iz baze, ovdje postavi njihove vrijednosti.

let DRZAVA = "";
let DRZAVA_FIRME = "";

// Primjer:
// DRZAVA = "Njemačka";
// DRZAVA_FIRME = "Austrija";


// ============================================
// 3. MAPIRANJE DRŽAVA I JEZIKA
// ============================================

const countryLanguages = {

    "bosna i hercegovina": {
        name: "Bosanski",
        locale: "bs-BA"
    },

    "bosnia and herzegovina": {
        name: "Bosanski",
        locale: "bs-BA"
    },

    "hrvatska": {
        name: "Hrvatski",
        locale: "hr-HR"
    },

    "croatia": {
        name: "Hrvatski",
        locale: "hr-HR"
    },

    "srbija": {
        name: "Srpski",
        locale: "sr-RS"
    },

    "serbia": {
        name: "Srpski",
        locale: "sr-RS"
    },

    "njemacka": {
        name: "Njemački",
        locale: "de-DE"
    },

    "germany": {
        name: "Njemački",
        locale: "de-DE"
    },

    "austrija": {
        name: "Njemački",
        locale: "de-AT"
    },

    "austria": {
        name: "Njemački",
        locale: "de-AT"
    },

    "svicarska": {
        name: "Njemački",
        locale: "de-CH"
    },

    "switzerland": {
        name: "Njemački",
        locale: "de-CH"
    },

    "francuska": {
        name: "Francuski",
        locale: "fr-FR"
    },

    "france": {
        name: "Francuski",
        locale: "fr-FR"
    },

    "italija": {
        name: "Italijanski",
        locale: "it-IT"
    },

    "italy": {
        name: "Italijanski",
        locale: "it-IT"
    },

    "spanija": {
        name: "Španski",
        locale: "es-ES"
    },

    "spain": {
        name: "Španski",
        locale: "es-ES"
    },

    "turska": {
        name: "Turski",
        locale: "tr-TR"
    },

    "turkey": {
        name: "Turski",
        locale: "tr-TR"
    },

    "ujedinjeno kraljevstvo": {
        name: "Engleski",
        locale: "en-GB"
    },

    "united kingdom": {
        name: "Engleski",
        locale: "en-GB"
    },

    "sad": {
        name: "Engleski",
        locale: "en-US"
    },

    "usa": {
        name: "Engleski",
        locale: "en-US"
    },

    "united states": {
        name: "Engleski",
        locale: "en-US"
    },

    "holandija": {
        name: "Holandski",
        locale: "nl-NL"
    },

    "nizozemska": {
        name: "Holandski",
        locale: "nl-NL"
    },

    "netherlands": {
        name: "Holandski",
        locale: "nl-NL"
    },

    "poljska": {
        name: "Poljski",
        locale: "pl-PL"
    },

    "poland": {
        name: "Poljski",
        locale: "pl-PL"
    },

    "rusija": {
        name: "Ruski",
        locale: "ru-RU"
    },

    "russia": {
        name: "Ruski",
        locale: "ru-RU"
    },

    "kina": {
        name: "Kineski",
        locale: "zh-CN"
    },

    "china": {
        name: "Kineski",
        locale: "zh-CN"
    },

    "saudijska arabija": {
        name: "Arapski",
        locale: "ar-SA"
    },

    "saudi arabia": {
        name: "Arapski",
        locale: "ar-SA"
    }
};


// ============================================
// 4. ODREĐIVANJE JEZIKA
// ============================================

let selectedLanguage = "bs-BA";
let selectedLanguageName = "Bosanski";
let manualLanguage = false;

function normalizeCountry(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}

function updateLanguage() {

    let country = DRZAVA;
    let source = "DRZAVA";

    if (!country || !country.trim()) {

        country = DRZAVA_FIRME;
        source = "DRZAVA_FIRME";

    }

    if (!country || !country.trim()) {

        document.getElementById("displayCountry").textContent =
            "Država nije dostupna";

        document.getElementById("countrySource").textContent =
            "Izvor: ručni izbor jezika";

        if (!manualLanguage) {
            selectedLanguage = "bs-BA";
            selectedLanguageName = "Bosanski";
        }

    } else {

        document.getElementById("displayCountry").textContent =
            country;

        document.getElementById("countrySource").textContent =
            "Izvor: kolona " + source;

        const key = normalizeCountry(country);

        const language = countryLanguages[key];

        if (language && !manualLanguage) {

            selectedLanguage = language.locale;
            selectedLanguageName = language.name;

        } else if (!language && !manualLanguage) {

            selectedLanguage = "bs-BA";
            selectedLanguageName = "Bosanski";

        }

    }

    showLanguage();
}


function showLanguage() {

    document.getElementById("displayLanguage").textContent =
        selectedLanguageName;

    document.getElementById("displayLocale").textContent =
        selectedLanguage;

}


// ============================================
// 5. RUČNA PROMJENA JEZIKA
// ============================================

document.getElementById("languageSelect")
.addEventListener("change", function() {

    const value = this.value;

    if (value === "auto") {

        manualLanguage = false;

        updateLanguage();

        document.getElementById("micStatus").textContent =
            "Jezik je automatski određen prema državi.";

        return;

    }

    manualLanguage = true;

    selectedLanguage = value;

    const selectedOption =
        this.options[this.selectedIndex];

    selectedLanguageName = selectedOption.textContent;

    showLanguage();

    document.getElementById("micStatus").textContent =
        "Ručno izabran jezik: " + selectedLanguageName;

});


// ============================================
// 6. GOVOR U TEKST - MIKROFON
// ============================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;

const micButton =
    document.getElementById("micButton");

const micStatus =
    document.getElementById("micStatus");

if (!SpeechRecognition) {

    micButton.disabled = true;

    micStatus.textContent =
        "Vaš preglednik ne podržava prepoznavanje govora. Pokušajte u Chromeu ili Edgeu.";

} else {

    recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function() {

        isListening = true;

        micButton.textContent = "⏹ ZAUSTAVI MIKROFON";

        micButton.classList.add("listening");

        micStatus.textContent =
            "Slušam... Govorite na jeziku: " +
            selectedLanguageName;

    };


    recognition.onresult = function(event) {

        let finalTranscript = "";
        let interimTranscript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const transcript =
                event.results[i][0].transcript;

            if (event.results[i].isFinal) {

                finalTranscript += transcript + " ";

            } else {

                interimTranscript += transcript;

            }

        }

        const input = document.getElementById("pojam");

        if (finalTranscript) {

            const existing = input.value.trim();

            input.value =
                existing
                ? existing + " " + finalTranscript.trim()
                : finalTranscript.trim();

        }

        micStatus.textContent =
            "Prepoznato: " +
            (finalTranscript + interimTranscript);

    };


    recognition.onerror = function(event) {

        micStatus.textContent =
            "Greška mikrofona: " + event.error;

        stopMicrophone();

    };


    recognition.onend = function() {

        isListening = false;

        micButton.textContent = "🎙️ POKRENI MIKROFON";

        micButton.classList.remove("listening");

    };


    micButton.addEventListener("click", function() {

        if (isListening) {

            recognition.stop();

            stopMicrophone();

        } else {

            recognition.lang = selectedLanguage;

            try {

                recognition.start();

            } catch(error) {

                micStatus.textContent =
                    "Mikrofon nije moguće pokrenuti: " +
                    error.message;

            }

        }

    });

}


function stopMicrophone() {

    isListening = false;

    micButton.textContent = "🎙️ POKRENI MIKROFON";

    micButton.classList.remove("listening");

}


// ============================================
// 7. PRIKAZ REZULTATA
// ============================================

function safeText(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value);

}


function renderList(elementId, items) {

    const container = document.getElementById(elementId);

    container.innerHTML = "";

    if (!Array.isArray(items) || items.length === 0) {

        container.textContent = "Nema rezultata.";

        return;

    }

    items.forEach(item => {

        const card = document.createElement("div");

        card.className = "result-card";

        const title = document.createElement("h3");

        title.textContent =
            safeText(
                item.naziv ||
                item.ime ||
                item.firma ||
                item.name ||
                "Firma"
            );

        card.appendChild(title);

        Object.entries(item).forEach(([key, value]) => {

            if (
                value === null ||
                value === undefined ||
                typeof value === "object"
            ) return;

            const paragraph = document.createElement("p");

            paragraph.textContent =
                key + ": " + String(value);

            card.appendChild(paragraph);

        });

        container.appendChild(card);

    });

}


// ============================================
// 8. GLAVNA PRETRAGA
// ============================================

document.getElementById("searchButton")
.addEventListener("click", async function() {

    const pojam =
        document.getElementById("pojam").value.trim();

    const ponuda =
        document.getElementById("ponuda").value.trim();

    const potraznja =
        document.getElementById("potraznja").value.trim();

    const detalji =
        document.getElementById("detalji").value.trim();

    const status =
        document.getElementById("mainStatus");

    if (!pojam) {

        status.textContent =
            "Unesite ili izgovorite pojam za pretragu.";

        status.className = "status error";

        return;

    }

    if (!ponuda && !potraznja && !detalji) {

        status.textContent =
            "Unesite ponudu, potražnju ili dodatne detalje.";

        status.className = "status error";

        return;

    }

    stopMicrophone();

    this.disabled = true;

    status.textContent = "Pretraga je u toku...";

    status.className = "status";

    document.getElementById("results")
        .classList.add("hidden");

    try {

        const { data, error } =
            await supabase.functions.invoke(
                "PRETRAGA_GLAVNA",
                {
                    body: {
                        pojam,
                        ponuda,
                        potraznja,
                        detalji
                    }
                }
            );

        if (error) throw error;

        if (!data) {
            throw new Error("Server nije vratio podatke.");
        }

        if (!data.success) {

            throw new Error(
                data.message || "Pretraga nije uspjela."
            );

        }

        const sourceNames = {
            "SUPABASE_BAZA": "SUPABASE BAZA",
            "INTERNET": "INTERNET",
            "NEMA_REZULTATA": "NEMA REZULTATA"
        };

        document.getElementById("sourceInfo").textContent =
            "Izvor rezultata: " +
            (sourceNames[data.izabrani_izvor] ||
             data.izabrani_izvor ||
             "Nepoznat");

        document.getElementById("stats").textContent =
            "Ukupno firmi: " +
            (data.statistika?.ukupno_firmi ?? 0);

        renderList(
            "companyResults",
            data.sve_firme
        );

        renderList(
            "buyerResults",
            data.potencijalni_kupci
        );

        renderList(
            "demandResults",
            data.potvrdjena_potraznja
        );

        renderList(
            "supplierResults",
            data.dobavljaci
        );

        renderList(
            "adResults",
            data.oglasi_u_bazi
        );

        document.getElementById("results")
            .classList.remove("hidden");

        status.textContent =
            "Pretraga je završena.";

        status.className = "status success";

    } catch(error) {

        status.textContent =
            "Greška: " + error.message;

        status.className = "status error";

    } finally {

        this.disabled = false;

    }

});


// ============================================
// 9. POČETNO UČITAVANJE
// ============================================

updateLanguage();

</script>

</body>
</html>
