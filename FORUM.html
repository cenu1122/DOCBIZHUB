<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSLOVNI FORUM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans uppercase">

    <!-- NAVIGACIJA -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">POSLOVNI FORUM</h1>
            <button onclick="OTVORI_MODAL()" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-semibold hover:bg-indigo-50 transition">NOVA TEMA</button>
        </div>
    </header>

    <!-- GLAVNI SADRŽAJ -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- FILTRI I PRETRAGA -->
        <div class="flex flex-col sm:flex-row justify-between gap-4 mb-6">
            <input type="text" id="PRETRAGA" placeholder="PRETRAŽI TEME..." class="px-4 py-2 border rounded-lg w-full sm:w-1/2 focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="FILTRIRAJ_TEME()">
            <select id="FILTER_KATEGORIJA" class="px-4 py-2 border rounded-lg w-full sm:w-1/4 focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="FILTRIRAJ_TEME()">
                <option value="">SVE KATEGORIJE</option>
                <option value="B2B">B2B SURADNJA</option>
                <option value="FINANCIJE">FINANCIJE</option>
                <option value="TEHNOLOGIJA">TEHNOLOGIJA</option>
            </select>
        </div>

        <!-- LISTA TEMA -->
        <div id="LISTA_TEMA" class="space-y-4">
            <!-- Dinamički sadržaj iz tabele POSAO_FORUM i POSAO_FORUM_KOMENTARI -->
        </div>
    </main>

    <!-- MODAL ZA NOVU TEMU -->
    <div id="MODAL_TEMA" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-lg shadow-xl">
            <h2 class="text-xl font-bold mb-4">OTVORITE NOVU TEMU</h2>
            <input type="text" id="NASLOV_TEME" placeholder="NASLOV TEME" class="w-full px-3 py-2 border rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <select id="KATEGORIJA_TEME" class="w-full px-3 py-2 border rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="B2B">B2B SURADNJA</option>
                <option value="FINANCIJE">FINANCIJE</option>
                <option value="TEHNOLOGIJA">TEHNOLOGIJA</option>
            </select>
            <textarea id="SADRZAJ_TEME" placeholder="SADRŽAJ RASPRAVE..." rows="4" class="w-full px-3 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="ZATVORI_MODAL()" class="px-4 py-2 bg-gray-200 rounded-lg text-gray-700 hover:bg-gray-300">OTKAŽI</button>
                <button onclick="SPREMI_TEMU()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">OBJAVI</button>
            </div>
        </div>
    </div>

    <!-- SKRIPTA ZA DVIJE TABELE -->
    <script>
        // 1. Tabela za teme
        let POSAO_FORUM = [
            {
                id: 1,
                kategorija: "B2B",
                naslov: "DOBRODOŠLI NA POSLOVNI FORUM",
                sadrzaj: "OVO JE POČETNA TEMA NA FORUMU.",
                autor: "ADMINISTRATOR",
                datum: "17.09.2026."
            }
        ];

        // 2. Odvojena tabela za komentare (povezana preko tema_id)
        let POSAO_FORUM_KOMENTARI = [
            { id: 1, tema_id: 1, autor: "KORISNIK1", tekst: "ODLIČNA INICIJATIVA!" }
        ];

        // Učitavanje pri pokretanju stranice
        window.onload = function() {
            PRIKAZI_TEME(POSAO_FORUM);
        };

        function PRIKAZI_TEME(temeZaPrikaz) {
            const kontejner = document.getElementById('LISTA_TEMA');
            kontejner.innerHTML = '';

            if (temeZaPrikaz.length === 0) {
                kontejner.innerHTML = '<p class="text-center text-gray-500 py-4">NEMA PRONAĐENIH TEMA.</p>';
                return;
            }

            temeZaPrikaz.forEach(tema => {
                // Izvlačenje komentara isključivo iz tabele POSAO_FORUM_KOMENTARI za trenutnu temu
                const komentariTeme = POSAO_FORUM_KOMENTARI.filter(k => k.tema_id === tema.id);
                
                let komentariHtml = komentariTeme.map(k => `
                    <p class="text-xs text-gray-600"><strong>${k.autor}:</strong> ${k.tekst}</p>
                `).join('');

                const htmlTema = `
                    <div class="p-4 bg-white rounded-lg shadow border border-gray-100">
                        <div class="flex justify-between items-center">
                            <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded font-medium">${tema.kategorija}</span>
                        </div>
                        <h3 class="text-lg font-semibold mt-2">${tema.naslov}</h3>
                        <p class="text-gray-600 text-sm mt-1">${tema.sadrzaj}</p>
                        
                        <!-- SEKCIJA ZA KOMENTARE -->
                        <div class="mt-4 border-t pt-3">
                            <h4 class="text-sm font-bold text-gray-700">KOMENTARI:</h4>
                            <div class="mt-2 space-y-2">
                                ${komentariHtml || '<p class="text-xs text-gray-400">NEMA KOMENTARA.</p>'}
                            </div>
                            <div class="mt-3 flex gap-2">
                                <input type="text" id="KOMENTAR_INPUT_${tema.id}" placeholder="OSTAVI KOMENTAR..." class="w-full px-3 py-1 text-xs border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <button onclick="DODAJ_KOMENTAR(${tema.id})" class="px-3 py-1 bg-indigo-600 text-white text-xs rounded-lg hover:bg-indigo-700">POŠALJI</button>
                            </div>
                        </div>

                        <div class="text-xs text-gray-400 mt-3 flex justify-between">
                            <span>AUTOR: ${tema.autor}</span>
                            <span>${tema.datum}</span>
                        </div>
                    </div>
                `;
                kontejner.innerHTML += htmlTema;
            });
        }

        function OTVORI_MODAL() {
            document.getElementById('MODAL_TEMA').classList.remove('hidden');
        }

        function ZATVORI_MODAL() {
            document.getElementById('MODAL_TEMA').classList.add('hidden');
        }

        function SPREMI_TEMU() {
            const NASLOV = document.getElementById('NASLOV_TEME').value.toUpperCase();
            const KATEGORIJA = document.getElementById('KATEGORIJA_TEME').value;
            const SADRZAJ = document.getElementById('SADRZAJ_TEME').value.toUpperCase();

            if(!NASLOV || !SADRZAJ) {
                alert('MOLIMO POPUNITE SVA POLJA.');
                return;
            }

            const noviId = POSAO_FORUM.length > 0 ? POSAO_FORUM[POSAO_FORUM.length - 1].id + 1 : 1;

            // Upis u tabelu POSAO_FORUM
            const novaTema = {
                id: noviId,
                kategorija: KATEGORIJA,
                naslov: NASLOV,
                sadrzaj: SADRZAJ,
                autor: "KORISNIK",
                datum: new Date().toLocaleDateString('bs-BA')
            };

            POSAO_FORUM.unshift(novaTema);

            ZATVORI_MODAL();
            document.getElementById('NASLOV_TEME').value = '';
            document.getElementById('SADRZAJ_TEME').value = '';
            
            PRIKAZI_TEME(POSAO_FORUM);
        }

        function DODAJ_KOMENTAR(temaId) {
            const inputPolje = document.getElementById(`KOMENTAR_INPUT_${temaId}`);
            const tekstKomentara = inputPolje.value.toUpperCase();
            
            if(!tekstKomentara) return;

            const noviKomentarId = POSAO_FORUM_KOMENTARI.length > 0 ? POSAO_FORUM_KOMENTARI[POSAO_FORUM_KOMENTARI.length - 1].id + 1 : 1;

            // Upis u odvojenu tabelu POSAO_FORUM_KOMENTARI
            POSAO_FORUM_KOMENTARI.push({
                id: noviKomentarId,
                tema_id: temaId,
                autor: "KORISNIK",
                tekst: tekstKomentara
            });

            inputPolje.value = '';
            PRIKAZI_TEME(POSAO_FORUM);
        }

        function FILTRIRAJ_TEME() {
            const pojam = document.getElementById('PRETRAGA').value.toLowerCase();
            const izabranaKategorija = document.getElementById('FILTER_KATEGORIJA').value;

            const filtrirano = POSAO_FORUM.filter(tema => {
                const poklapaPretragu = tema.naslov.toLowerCase().includes(pojam) || tema.sadrzaj.toLowerCase().includes(pojam);
                const poklapaKategoriju = izabranaKategorija === "" || tema.kategorija === izabranaKategorija;
                return poklapaPretragu && poklapaKategoriju;
            });

            PRIKAZI_TEME(filtrirano);
        }
    </script>
</body>
</html>
