 
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promjena lozinke</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(20, 40, 80, .10);
    }

    h1 { margin-top: 0; font-size: 26px; }
    p { color: #596579; line-height: 1.5; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd4e0;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #2563eb;
      border-color: transparent;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #1d4ed8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #poruka {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      overflow-wrap: anywhere;
    }

    #poruka.uspjeh { display: block; background: #dcfce7; color: #166534; }
    #poruka.greska { display: block; background: #fee2e2; color: #991b1b; }

    .napomena { font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Promjena lozinke</h1>
    <p>Unesite novu lozinku za svoj korisnički račun.</p>

    <form id="forma">
      <label for="lozinka">Nova lozinka</label>
      <input
        id="lozinka"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="Najmanje 8 znakova"
      >

      <label for="potvrda">Potvrdite novu lozinku</label>
      <input
        id="potvrda"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="Ponovite novu lozinku"
      >

      <button id="dugme" type="submit">Promijeni lozinku</button>
    </form>

    <div id="poruka" role="status" aria-live="polite"></div>
    <p class="napomena">Ako je link istekao ili je već iskorišten, zatražite novi link za promjenu lozinke.</p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Zamijenite ovim podacima iz Supabase projekta.
    const SUPABASE_URL = "https://VASA-PROJEKT-REF.supabase.co";
    const SUPABASE_ANON_KEY = "OVDJE_UNESITE_PUBLISHABLE_ILI_ANON_KLJUC";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const forma = document.getElementById("forma");
    const dugme = document.getElementById("dugme");
    const poruka = document.getElementById("poruka");

    function prikaziPoruku(tekst, tip) {
      poruka.textContent = tekst;
      poruka.className = tip;
    }

    // Supabase može vratiti grešku u URL-u ako je link nevažeći.
    const parametri = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const greskaURL =
      parametri.get("error_description") ||
      query.get("error_description");

    if (greskaURL) {
      prikaziPoruku(
        "Link nije važeći: " + greskaURL.replace(/\+/g, " "),
        "greska"
      );
      dugme.disabled = true;
    }

    forma.addEventListener("submit", async (event) => {
      event.preventDefault();

      const lozinka = document.getElementById("lozinka").value;
      const potvrda = document.getElementById("potvrda").value;

      if (lozinka.length < 8) {
        prikaziPoruku(
          "Lozinka mora imati najmanje 8 znakova.",
          "greska"
        );
        return;
      }

      if (lozinka !== potvrda) {
        prikaziPoruku("Lozinke se ne podudaraju.", "greska");
        return;
      }

      dugme.disabled = true;
      dugme.textContent = "Spremanje...";
      prikaziPoruku("", "");

      try {
        // Ako je recovery sesija uspostavljena, Supabase će
        // promijeniti lozinku prijavljenog korisnika.
        const { data: { session }, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
          prikaziPoruku(
            "Link za promjenu lozinke nije aktivan ili je istekao. Zatražite novi link iz e-maila.",
            "greska"
          );
          return;
        }

        const { error } = await supabase.auth.updateUser({
          password: lozinka
        });

        if (error) throw error;

        prikaziPoruku(
          "Lozinka je uspješno promijenjena. Sada se možete prijaviti novom lozinkom.",
          "uspjeh"
        );

        forma.reset();
      } catch (error) {
        prikaziPoruku(
          "Promjena lozinke nije uspjela: " +
            (error?.message || "Nepoznata greška"),
          "greska"
        );
      } finally {
        dugme.disabled = false;
        dugme.textContent = "Promijeni lozinku";
      }
    });
  </script>
</body>
</html>
