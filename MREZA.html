    <script>

        /* ==========================================

        const SUPABASE_URL =

        let _supabase =
            (typeof supabase !== 'undefined')
                ? supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_ANON_KEY

        window.onload = function () {

        /* ==========================================
           UZMI MAIL TRENUTNOG KORISNIKA
        ========================================== */

        function DOBAVI_KORISNIK_MAIL() {

            /*
             * OVDJE UZIMAMO MAIL IZ localStorage.
             *
             * Ako si kod sebe mail sačuvao pod drugim
             * nazivom, promijeni ovaj dio.
             */

            const korisnikMail =
                localStorage.getItem('KORISNIK_MAIL') ||
                localStorage.getItem('korisnik_mail') ||
                localStorage.getItem('EMAIL') ||
                localStorage.getItem('email');

            return korisnikMail;
        }


        /* ==========================================
           1. UČITAJ SAMO PRIJATELJE
           
           GDJE JE:
           
           POSAO_PRIJATELJI.KORISNIK_MAIL
           
           = MAIL TRENUTNOG KORISNIKA
        ========================================== */

        async function UČITAJ_PRIJATELJE() {

            if (!_supabase) {
                console.error('Supabase nije učitan.');
                return;
            }


            const korisnikMail = DOBAVI_KORISNIK_MAIL();


            console.log(
                'KORISNIK MAIL:',
                korisnikMail
            );


            const kontejner =
                document.getElementById(
                    'MOJI_PRIJATELJI_LISTA'
                );

            const badge =
                document.getElementById(
                    'broj-prijatelja'
                );


            kontejner.innerHTML = '';


            /* ------------------------------------------
               AKO NEMA MAILA
            ------------------------------------------ */

            if (!korisnikMail) {

                kontejner.innerHTML = `
                    <p class="text-xs text-red-500">
                        Nije pronađen KORISNIK_MAIL.
                    </p>
                `;

                badge.textContent =
                    '0 prijatelja';

                console.error(
                    'KORISNIK_MAIL nije pronađen u localStorage.'
                );

                return;
            }


            /* ------------------------------------------
               DOHVATI SAMO PRIJATELJE TOG KORISNIKA
               
               OVO JE GLAVNI DIO IZMJENE
            ------------------------------------------ */

            const {
                data,
                error
            } = await _supabase

                .from('POSAO_PRIJATELJI')

                .select('*')

                .eq(
                    'KORISNIK_MAIL',
                    korisnikMail
                )

                .order(
                    'id',
                    {
                        ascending: false
                    }
                );


            /* ------------------------------------------
               GREŠKA
            ------------------------------------------ */

            if (error) {

                console.error(
                    'Greška pri dohvatu prijatelja:',
                    error
                );

                kontejner.innerHTML = `
                    <p class="text-xs text-red-500">
                        Greška: ${error.message}
                    </p>
                `;

                badge.textContent =
                    '0 prijatelja';

                return;
            }


            /* ------------------------------------------
               NEMA PRIJATELJA
            ------------------------------------------ */

            if (!data || data.length === 0) {

                kontejner.innerHTML = `
                    <p class="text-xs text-gray-500 italic">
                        Nema prijatelja za korisnika:
                        ${korisnikMail}
                    </p>
                `;

                badge.textContent =
                    '0 prijatelja';

                return;

               BROJ PRIJATELJA

               PRIKAŽI PRIJATELJE

                    p.NAZIV ||
                    p.naziv ||
                    p.PRIJATELJ_IME ||
                    p.prijatelj_ime ||
                    'PRIJATELJ';


                const status =
                    p.STATUS ||
                    p.status ||
                    'AKTIVAN';


                const email =
                    p.EMAIL ||
                    p.email ||
                    p.PRIJATELJ_MAIL ||
                    p.prijatelj_mail ||
                    '';


                const inicijali =
                    ime
                        .substring(0, 2)
                        .toUpperCase();


                kontejner.innerHTML += `

                    <div
                        class="p-3 bg-gray-50 rounded border
                        flex items-center gap-3 text-xs">

                        <div

                            bg-blue-100 text-blue-700

           2. UČITAVANJE SVIH KORISNIKA
        ========================================== */

        async function UČITAJ_KORISNIKE() {

            if (!_supabase) return;


            const {
                data,
                error
            } = await _supabase

                .from('POSAO_KORISNICI')

                .select('*')

                .order(
                    'id',
                    {
                        ascending: false
                    }
                );


            const kontejner =
                document.getElementById(
                    'SPISAK_SVIH_KORISNIKA'
                );

            const badge =
                document.getElementById(
                    'broj-korisnika'
                );


            kontejner.innerHTML = '';


            /* ------------------------------------------
               GREŠKA
            ------------------------------------------ */

            if (error) {

                console.error(
                    "Greška pri dohvatu korisnika:",
                    error
                );

                kontejner.innerHTML = `
                    <p class="text-xs text-red-500">
                        Greška: ${error.message}
                    </p>
                `;

                return;
            }


            /* ------------------------------------------
               NEMA KORISNIKA
            ------------------------------------------ */

            if (!data || data.length === 0) {

                kontejner.innerHTML = `
                    <p class="text-xs text-gray-500 italic">
                        Nema unosa u tabeli POSAO_KORISNICI.
                    </p>
                `;

                badge.textContent =
                    '0 korisnika';

                return;
            }


            badge.textContent =
                data.length + ' korisnika';


            /* ------------------------------------------
               PRIKAŽI SVE KORISNIKE
            ------------------------------------------ */

            data.forEach(item => {

                const ime =
                    item.IME ||
                    item.ime ||
                    'NEPOZNATO';


                const firma =
                    item.FIRMA ||
                    item.firma ||
                    'N/A';


                const telefon =
                    item.TELEFON ||
                    item.telefon ||
                    '/';


                const email =
                    item.EMAIL ||
                    item.email ||
                    '/';


                const datum =
                    item.DATUM
                        ? new Date(
                            item.DATUM
                          ).toLocaleDateString(
                            'bs-BA'
                          )
                        : 'N/A';


                kontejner.innerHTML += `

                    <div
                        class="p-3 bg-gray-50 rounded border
                        flex justify-between items-center text-xs">

                                👤 ${ime.toUpperCase()}

                                📞 Tel:

                            <span
                                class="bg-blue-100
                                text-blue-800
                                font-bold px-2 py-1
                                rounded text-[10px]">

                            </span>


                            <p
                                class="text-[9px]
                                text-gray-400 mt-1">

                                ${datum}

                            </p>

                        </div>

                    </div>

                `;

            });

        }

    </script>
