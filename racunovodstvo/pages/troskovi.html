
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troškovi | DOCBIZHUB</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }

    .container { max-width: 1200px; margin: auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { font-size: 19px; margin: 0 0 18px; }
    .muted { color: #6b7280; font-size: 14px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card, .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px #00000008;
    }

    .card .label { color: #6b7280; font-size: 14px; }
    .card .value {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .panel { margin-bottom: 24px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font: inherit;
      background: white;
    }

    textarea { min-height: 85px; resize: vertical; }
    .field-full { grid-column: 1 / -1; }

    button, .button-link {
      display: inline-block;
      padding: 11px 16px;
      border: 0;
      border-radius: 7px;
      background: #b91c1c;
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #374151; }
    .danger { background: #991b1b; }

    .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 760px; }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }

    th { background: #f9fafb; white-space: nowrap; }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }

    .hidden { display: none !important; }
    .row-actions { display: flex; gap: 7px; }
    .row-actions button { padding: 8px 10px; }

    @media (max-width: 600px) {
      body { padding: 14px; }
      h1 { font-size: 23px; }
      .card, .panel { padding: 15px; }
    }
  </style>
</head>

<body>
<main class="container">

  <header class="header">
    <div>
      <h1>Troškovi</h1>
      <div class="muted">Evidencija i pregled poslovnih troškova</div>
    </div>
    <a class="button-link secondary" href="prihodi.html">Nazad na prihode</a>
  </header>

  <div id="PORUKA" class="status">Provjeravam prijavu...</div>

  <section class="cards">
    <div class="card">
      <div class="label">Ukupni troškovi — svi zapisi</div>
      <div class="value" id="UKUPNO_SVE">0,00 KM</div>
    </div>
    <div class="card">
      <div class="label">Troškovi ovog mjeseca</div>
      <div class="value" id="UKUPNO_MJESEC">0,00 KM</div>
    </div>
    <div class="card">
      <div class="label">Broj evidentiranih troškova</div>
      <div class="value" id="BROJ_TROSKOVA">0</div>
    </div>
  </section>

  <section class="panel">
    <h2 id="NASLOV_FORME">Dodaj novi trošak</h2>

    <form id="FORMA_TROSAK">
      <div class="form-grid">
        <div>
          <label for="DATUM">Datum troška *</label>
          <input type="date" id="DATUM" required>
        </div>

        <div>
          <label for="IZNOS">Iznos (KM) *</label>
          <input type="number" id="IZNOS" min="0.01" step="0.01"
                 placeholder="0.00" required>
        </div>

        <div>
          <label for="KATEGORIJA">Kategorija *</label>
          <select id="KATEGORIJA" required>
            <option value="">Odaberi kategoriju</option>
            <option value="Zakup">Zakup</option>
            <option value="Plate">Plate</option>
            <option value="Režije">Režije</option>
            <option value="Gorivo">Gorivo</option>
            <option value="Oprema">Oprema</option>
            <option value="Materijal">Materijal</option>
            <option value="Marketing">Marketing</option>
            <option value="Transport">Transport</option>
            <option value="Porezi i naknade">Porezi i naknade</option>
            <option value="Usluge">Usluge</option>
            <option value="Ostalo">Ostalo</option>
          </select>
        </div>

        <div>
          <label for="DOBAVLJAC">Dobavljač</label>
          <input type="text" id="DOBAVLJAC"
                 placeholder="Naziv dobavljača">
        </div>

        <div class="field-full">
          <label for="OPIS">Opis troška</label>
          <textarea id="OPIS"
                    placeholder="Dodatne informacije o trošku..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button id="DUGME_SACUVAJ" type="submit">Sačuvaj trošak</button>
        <button id="DUGME_ODUSTANI" class="secondary hidden"
                type="button">Odustani od izmjene</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>Evidencija troškova</h2>

    <div class="filters">
      <div>
        <label for="PRETRAGA">Pretraga</label>
        <input type="search" id="PRETRAGA"
               placeholder="Kategorija, dobavljač ili opis">
      </div>

      <div>
        <label for="FILTER_OD">Datum od</label>
        <input type="date" id="FILTER_OD">
      </div>

      <div>
        <label for="FILTER_DO">Datum do</label>
        <input type="date" id="FILTER_DO">
      </div>

      <div>
        <label for="FILTER_KATEGORIJA">Kategorija</label>
        <select id="FILTER_KATEGORIJA">
          <option value="">Sve kategorije</option>
          <option value="Zakup">Zakup</option>
          <option value="Plate">Plate</option>
          <option value="Režije">Režije</option>
          <option value="Gorivo">Gorivo</option>
          <option value="Oprema">Oprema</option>
          <option value="Materijal">Materijal</option>
          <option value="Marketing">Marketing</option>
          <option value="Transport">Transport</option>
          <option value="Porezi i naknade">Porezi i naknade</option>
          <option value="Usluge">Usluge</option>
          <option value="Ostalo">Ostalo</option>
        </select>
      </div>
    </div>

    <div class="muted" id="BROJ_REZULTATA"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Datum</th>
            <th>Kategorija</th>
            <th>Dobavljač</th>
            <th>Opis</th>
            <th>Iznos</th>
            <th>Akcije</th>
          </tr>
        </thead>
        <tbody id="LISTA_TROSKOVA">
          <tr><td colspan="6">Učitavanje...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<script>
"use strict";

let DB = null;
let KORISNIK_ID = null;
let SVI_TROSKOVI = [];
let ID_IZMJENE = null;

const $ = (id) => document.getElementById(id);

function PORUKA(tekst) {
  $("PORUKA").textContent = tekst;
}

function FORMATIRAJ_IZNOS(iznos) {
  return new Intl.NumberFormat("bs-BA", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Number(iznos) || 0) + " KM";
}

function DANAS() {
  const sada = new Date();
  const pomak = sada.getTimezoneOffset() * 60000;
  return new Date(sada.getTime() - pomak).toISOString().slice(0, 10);
}

function RESETUJ_FORMU() {
  $("FORMA_TROSAK").reset();
  $("DATUM").value = DANAS();
  ID_IZMJENE = null;
  $("NASLOV_FORME").textContent = "Dodaj novi trošak";
  $("DUGME_SACUVAJ").textContent = "Sačuvaj trošak";
  $("DUGME_ODUSTANI").classList.add("hidden");
}

function FILTRIRANI_TROSKOVI() {
  const tekst = $("PRETRAGA").value.trim().toLocaleLowerCase("bs");
  const od = $("FILTER_OD").value;
  const doDatuma = $("FILTER_DO").value;
  const kategorija = $("FILTER_KATEGORIJA").value;

  return SVI_TROSKOVI.filter((t) => {
    if (od && t.DATUM < od) return false;
    if (doDatuma && t.DATUM > doDatuma) return false;
    if (kategorija && t.KATEGORIJA !== kategorija) return false;

    const traziviTekst = [
      t.KATEGORIJA, t.DOBAVLJAC, t.OPIS
    ].join(" ").toLocaleLowerCase("bs");

    return !tekst || traziviTekst.includes(tekst);
  });
}

function PRIKAZI_STATISTIKU() {
  const mjesec = DANAS().slice(0, 7);

  const ukupno = SVI_TROSKOVI.reduce(
    (zbir, t) => zbir + Number(t.IZNOS || 0), 0
  );

  const mjesecUkupno = SVI_TROSKOVI.reduce((zbir, t) => {
    return t.DATUM && t.DATUM.startsWith(mjesec)
      ? zbir + Number(t.IZNOS || 0)
      : zbir;
  }, 0);

  $("UKUPNO_SVE").textContent = FORMATIRAJ_IZNOS(ukupno);
  $("UKUPNO_MJESEC").textContent = FORMATIRAJ_IZNOS(mjesecUkupno);
  $("BROJ_TROSKOVA").textContent = String(SVI_TROSKOVI.length);
}

function PRIKAZI_TABELU() {
  const lista = $("LISTA_TROSKOVA");
  lista.replaceChildren();

  const od = $("FILTER_OD").value;
  const doDatuma = $("FILTER_DO").value;

  if (od && doDatuma && od > doDatuma) {
    $("BROJ_REZULTATA").textContent =
      "Datum 'od' ne može biti poslije datuma 'do'.";
    return;
  }

  const podaci = FILTRIRANI_TROSKOVI();
  $("BROJ_REZULTATA").textContent =
    "Prikazano " + podaci.length + " od " + SVI_TROSKOVI.length + " troškova.";

  if (!podaci.length) {
    const red = lista.insertRow();
    const celija = red.insertCell();
    celija.colSpan = 6;
    celija.textContent = "Nema troškova za odabrane filtere.";
    return;
  }

  for (const t of podaci) {
    const red = lista.insertRow();

    for (const vrijednost of [
      t.DATUM, t.KATEGORIJA, t.DOBAVLJAC, t.OPIS
    ]) {
      const celija = red.insertCell();
      celija.textContent = vrijednost || "—";
    }

    red.insertCell().textContent = FORMATIRAJ_IZNOS(t.IZNOS);

    const akcije = red.insertCell();
    const grupa = document.createElement("div");
    grupa.className = "row-actions";

    const izmijeni = document.createElement("button");
    izmijeni.type = "button";
    izmijeni.className = "secondary";
    izmijeni.textContent = "Izmijeni";
    izmijeni.addEventListener("click", () => UCITAJ_U_FORMU(t));

    const obrisi = document.createElement("button");
    obrisi.type = "button";
    obrisi.className = "danger";
    obrisi.textContent = "Obriši";
    obrisi.addEventListener("click", () => OBRISI_TROSAK(t.ID));

    grupa.append(izmijeni, obrisi);
    akcije.appendChild(grupa);
  }
}

async function UCITAJ_TROSKOVE() {
  PORUKA("Učitavam troškove...");

  const { data, error } = await DB
    .from("TROSKOVI")
    .select("ID, USER_ID, DATUM, IZNOS, KATEGORIJA, DOBAVLJAC, OPIS, KREIRANO")
    .eq("USER_ID", KORISNIK_ID)
    .order("DATUM", { ascending: false })
    .order("KREIRANO", { ascending: false });

  if (error) {
    console.error("Greška pri učitavanju troškova:", error);
    PORUKA("Troškovi nisu učitani. Provjeri RLS pravila tabele TROSKOVI.");
    return;
  }

  SVI_TROSKOVI = data || [];
  PRIKAZI_STATISTIKU();
  PRIKAZI_TABELU();
  PORUKA("Troškovi su učitani.");
}

async function SACUVAJ_TROSAK(event) {
  event.preventDefault();

  const iznos = Number($("IZNOS").value);

  if (!Number.isFinite(iznos) || iznos <= 0) {
    PORUKA("Unesi iznos veći od nule.");
    return;
  }

  const zapis = {
    USER_ID: KORISNIK_ID,
    DATUM: $("DATUM").value,
    IZNOS: iznos,
    KATEGORIJA: $("KATEGORIJA").value,
    DOBAVLJAC: $("DOBAVLJAC").value.trim() || null,
    OPIS: $("OPIS").value.trim() || null
  };

  if (!zapis.DATUM || !zapis.KATEGORIJA) {
    PORUKA("Datum i kategorija su obavezni.");
    return;
  }

  $("DUGME_SACUVAJ").disabled = true;
  PORUKA("Čuvam trošak...");

  try {
    let rezultat;

    if (ID_IZMJENE) {
      rezultat = await DB
        .from("TROSKOVI")
        .update(zapis)
        .eq("ID", ID_IZMJENE)
        .eq("USER_ID", KORISNIK_ID);
    } else {
      rezultat = await DB.from("TROSKOVI").insert(zapis);
    }

    if (rezultat.error) throw rezultat.error;

    RESETUJ_FORMU();
    await UCITAJ_TROSKOVE();
    PORUKA("Trošak je uspješno sačuvan.");
  } catch (error) {
    console.error("Greška pri čuvanju troška:", error);
    PORUKA("Čuvanje nije uspjelo. Provjeri RLS pravila i pokušaj ponovo.");
  } finally {
    $("DUGME_SACUVAJ").disabled = false;
  }
}

function UCITAJ_U_FORMU(t) {
  ID_IZMJENE = t.ID;
  $("DATUM").value = t.DATUM || DANAS();
  $("IZNOS").value = t.IZNOS;
  $("KATEGORIJA").value = t.KATEGORIJA || "";
  $("DOBAVLJAC").value = t.DOBAVLJAC || "";
  $("OPIS").value = t.OPIS || "";

  $("NASLOV_FORME").textContent = "Izmijeni trošak";
  $("DUGME_SACUVAJ").textContent = "Sačuvaj izmjene";
  $("DUGME_ODUSTANI").classList.remove("hidden");

  $("FORMA_TROSAK").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function OBRISI_TROSAK(id) {
  if (!confirm("Da li sigurno želiš obrisati ovaj trošak?")) return;

  PORUKA("Brišem trošak...");

  const { error } = await DB
    .from("TROSKOVI")
    .delete()
    .eq("ID", id)
    .eq("USER_ID", KORISNIK_ID);

  if (error) {
    console.error("Greška pri brisanju troška:", error);
    PORUKA("Brisanje nije uspjelo. Provjeri RLS DELETE pravilo.");
    return;
  }

  if (ID_IZMJENE === id) RESETUJ_FORMU();

  await UCITAJ_TROSKOVE();
  PORUKA("Trošak je obrisan.");
}

async function POKRENI_STRANICU() {
  try {
    if (window.DB && typeof window.DB.from === "function") {
      DB = window.DB;
    } else if (
      window.supabaseClient &&
      typeof window.supabaseClient.from === "function"
    ) {
      DB = window.supabaseClient;
    } else if (
      typeof window.DOBAVI_SUPABASE === "function"
    ) {
      DB = window.DOBAVI_SUPABASE();
    } else if (
      typeof window.POVEZI_SUPABASE === "function"
    ) {
      DB = await window.POVEZI_SUPABASE();
    }

    if (!DB || !DB.auth || typeof DB.from !== "function") {
      PORUKA("Supabase klijent nije pronađen. Postojeći js/supabase.js nije izmijenjen.");
      return;
    }

    const { data, error } = await DB.auth.getUser();

    if (error || !data || !data.user) {
      PORUKA("Nisi prijavljen. Prijavi se pa ponovo otvori stranicu troškova.");
      return;
    }

    KORISNIK_ID = data.user.id;
    $("DATUM").value = DANAS();

    $("FORMA_TROSAK").addEventListener("submit", SACUVAJ_TROSAK);
    $("DUGME_ODUSTANI").addEventListener("click", RESETUJ_FORMU);

    ["PRETRAGA", "FILTER_OD", "FILTER_DO", "FILTER_KATEGORIJA"]
      .forEach((id) => {
        $(id).addEventListener("input", PRIKAZI_TABELU);
        $(id).addEventListener("change", PRIKAZI_TABELU);
      });

    await UCITAJ_TROSKOVE();
  } catch (error) {
    console.error("Greška pri pokretanju stranice:", error);
    PORUKA("Stranica nije mogla pokrenuti evidenciju. Provjeri konzolu preglednika.");
  }
}

POKRENI_STRANICU();
</script>
</body>
</html>
