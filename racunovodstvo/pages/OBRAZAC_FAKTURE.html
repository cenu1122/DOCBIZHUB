<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocBizHub — Faktura</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f2f6fc;
  color: #183153;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 5px 25px #17345b12;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  border-bottom: 2px solid #1769e8;
  padding-bottom: 15px;
}

h1 { margin: 0; color: #1769e8; }

h2 {
  font-size: 17px;
  margin-top: 24px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

label {
  display: block;
  margin: 10px 0 5px;
  font-size: 13px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccd8e8;
  border-radius: 6px;
  font: inherit;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

th, td {
  padding: 8px;
  border: 1px solid #dce5f0;
  text-align: left;
}

th { background: #edf4ff; }
td input { min-width: 65px; }

button {
  padding: 10px 14px;
  margin: 5px 3px 5px 0;
  border: 0;
  border-radius: 6px;
  background: #1769e8;
  color: white;
  cursor: pointer;
}

.delete { background: #d93025; }

.totals {
  max-width: 420px;
  margin: 20px 0 0 auto;
}

.totals div {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.grand {
  background: #1769e8;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.invoice-tools {
  display: grid;
  grid-template-columns: minmax(220px, 1.4fr) minmax(180px, 1fr) minmax(150px, .8fr);
  gap: 12px;
  align-items: end;
  margin: 18px 0;
  padding: 14px;
  background: #f7faff;
  border: 1px solid #dce5f0;
  border-radius: 10px;
}

.invoice-tools label { margin-top: 0; }
.invoice-tools .hint {
  grid-column: 1/-1;
  color: #52657e;
  font-size: 12px;
}

@media(max-width: 750px) {
  .invoice-tools { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
  .table-wrap { overflow-x: auto; }
}

@media print {
  body { background: white; padding: 0; }
  .container { box-shadow: none; padding: 0; }
  .no-print { display: none !important; }
  input, select, textarea {
    border: none;
    padding: 2px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div>
    <h1 data-i18n="title">FAKTURA</h1>
    <p>DocBizHub</p>
  </div>

  <div>
    <label for="language" data-i18n="language">Jezik</label>
    <select id="language" onchange="changeLanguage()">
      <option value="bs">🇧🇦 Bosanski</option>
      <option value="hr">🇭🇷 Hrvatski</option>
      <option value="sr">🇷🇸 Srpski</option>
      <option value="me">🇲🇪 Crnogorski</option>
      <option value="sl">🇸🇮 Slovenski</option>
      <option value="mk">🇲🇰 Makedonski</option>
      <option value="en">🇬🇧 English</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="it">🇮🇹 Italiano</option>
    </select>
  </div>
</header>

<div class="grid">
  <section>
    <h2 data-i18n="seller">Podaci o prodavcu</h2>
    <label data-i18n="company">Firma</label>
    <input id="sellerName">

    <label data-i18n="address">Adresa</label>
    <input id="sellerAddress">

    <label data-i18n="tax">JIB / ID broj</label>
    <input id="sellerTax">

    <label data-i18n="vatid">PDV broj</label>
    <input id="sellerVat">

    <label data-i18n="contact">Telefon / e-mail</label>
    <input id="sellerContact">

    <label data-i18n="bank">Banka</label>
    <input id="sellerBank">

    <label data-i18n="account">Transakcijski račun</label>
    <input id="sellerAccount">
  </section>

  <section>
    <h2 data-i18n="buyer">Podaci o kupcu</h2>
    <label data-i18n="company">Firma / ime kupca</label>
    <input id="buyerName">

    <label data-i18n="address">Adresa</label>
    <input id="buyerAddress">

    <label data-i18n="tax">JIB / ID broj</label>
    <input id="buyerTax">

    <label data-i18n="vatid">PDV broj</label>
    <input id="buyerVat">

    <label data-i18n="contact">Telefon / e-mail</label>
    <input id="buyerContact">
  </section>

  <section>
    <h2 data-i18n="details">Podaci o fakturi</h2>
    <label data-i18n="number">Broj fakture</label>
    <input id="invoiceNumber" value="2026-001">

    <label data-i18n="issued">Datum izdavanja</label>
    <input id="invoiceDate" type="date">

    <label data-i18n="due">Datum dospijeća</label>
    <input id="dueDate" type="date">

    <label data-i18n="currency">Valuta</label>
    <select id="currency" onchange="calculate()">
      <option value="BAM">BAM / KM</option>
      <option value="EUR">EUR / €</option>
      <option value="RSD">RSD</option>
      <option value="MKD">MKD</option>
    </select>
  </section>
</div>

<h2 data-i18n="items">Stavke fakture</h2>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th data-i18n="description">Opis</th>
      <th data-i18n="qty">Količina</th>
      <th data-i18n="price">Cijena</th>
      <th data-i18n="discount">Rabat %</th>
      <th data-i18n="vat">PDV %</th>
      <th data-i18n="amount">Iznos</th>
      <th class="no-print">×</th>
    </tr>
  </thead>
  <tbody id="items"></tbody>
</table>
</div>

<button class="no-print" onclick="addItem()" data-i18n="add">
  + Dodaj stavku
</button>

<div class="grid">
  <section>
    <h2 data-i18n="notes">Napomena</h2>
    <textarea id="notes" rows="4"></textarea>
  </section>

  <section>
    <h2 data-i18n="payment">Plaćanje</h2>
    <label data-i18n="method">Način plaćanja</label>
    <select id="payment">
      <option value="transfer">Bankovni transfer</option>
      <option value="cash">Gotovina</option>
      <option value="card">Kartica</option>
    </select>

    <label data-i18n="issuer">Fakturu izdao/la</label>
    <input id="issuer">
  </section>
</div>

<div class="totals">
  <div><span data-i18n="subtotal">Osnovica</span><strong id="subtotal">0,00</strong></div>
  <div><span data-i18n="discountTotal">Rabat</span><strong id="discountTotal">0,00</strong></div>
  <div><span data-i18n="vatTotal">PDV</span><strong id="vatTotal">0,00</strong></div>
  <div class="grand"><span data-i18n="total">UKUPNO</span><strong id="total">0,00</strong></div>
</div>

<div class="no-print invoice-tools">
  <div>
    <label for="invoiceList" data-i18n="invoiceList">Lista faktura</label>
    <select id="invoiceList">
      <option value="" data-i18n="chooseInvoice">— Izaberi fakturu —</option>
    </select>
  </div>

  <div>
    <label for="invoiceSearch" data-i18n="searchInvoices">Pretraga faktura</label>
    <input id="invoiceSearch" type="search"
      placeholder="Broj fakture ili kupac"
      data-i18n-placeholder="searchPlaceholder">
  </div>

  <div>
    <label for="invoiceStatusFilter" data-i18n="filterStatus">Filter statusa</label>
    <select id="invoiceStatusFilter">
      <option value="all" data-i18n="allStatuses">Svi statusi</option>
      <option value="NEPLACENA" data-i18n="unpaid">Neplaćene</option>
      <option value="PLACENA" data-i18n="paid">Plaćene</option>
      <option value="DJELOMICNO_PLACENA" data-i18n="partial">Djelimično plaćene</option>
    </select>
  </div>

  <div class="hint" id="invoiceListHint" data-i18n="listHint">
    Fakture se učitavaju iz vašeg Supabase naloga.
  </div>
</div>

<div class="no-print" style="margin-top:12px">
  <button onclick="saveInvoice()" data-i18n="save">Sačuvaj fakturu</button>
  <button onclick="refreshInvoiceList()" data-i18n="refreshInvoices">Osvježi listu</button>
  <button onclick="window.print()" data-i18n="print">Štampaj / PDF</button>
  <button onclick="newInvoice()" data-i18n="new">Nova faktura</button>
</div>

function changeLanguage() {
  const lang = document.getElementById("language").value;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (translations[lang][key]) el.placeholder = translations[lang][key];
  });
  renderInvoiceList();
}

function addItem(desc="", qty=1, price=0, discount=0, vat=17) {
  const row = document.createElement("tr");
  row.innerHTML = `
    <td class="index"></td>
    <td><input class="desc" value="${escapeHTML(desc)}"></td>
    <td><input class="qty" type="number" min="0" step="any" value="${qty}"></td>
    <td><input class="price" type="number" min="0" step="any" value="${price}"></td>
    <td><input class="discount" type="number" min="0" max="100" value="${discount}"></td>
    <td><input class="vat" type="number" min="0" max="100" value="${vat}"></td>
    <td class="amount">0.00</td>
    <td class="no-print"><button class="delete" type="button">×</button></td>`;
  document.getElementById("items").appendChild(row);
  row.querySelectorAll("input").forEach(input => input.addEventListener("input", calculate));
  row.querySelector(".delete").onclick = () => {
    row.remove();
    renumber();
    calculate();
  };
  renumber();
  calculate();
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function renumber() {
  document.querySelectorAll("#items tr").forEach((row, i) => {
    row.querySelector(".index").textContent = i + 1;
  });
}

function money(value) {
  const currency = document.getElementById("currency").value;
  try {
    const localeByLang = {
      bs:"bs-BA", hr:"hr-HR", sr:"sr-RS", me:"sr-ME",
      sl:"sl-SI", mk:"mk-MK", en:"en-GB", de:"de-DE", it:"it-IT"
    };
    return new Intl.NumberFormat(
      localeByLang[document.getElementById("language")?.value || "bs"] || "bs-BA",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 }
    ).format(value) + " " + currency;
  } catch {
    return value.toFixed(2) + " " + currency;
  }
}

function calculate() {
  let subtotal = 0, discounts = 0, vatTotal = 0, total = 0;

  document.querySelectorAll("#items tr").forEach(row => {
    const qty = Math.max(0, Number(row.querySelector(".qty").value) || 0);
    const price = Math.max(0, Number(row.querySelector(".price").value) || 0);
    const discount = Math.min(
      100,
      Math.max(0, Number(row.querySelector(".discount").value) || 0)
    );
    const vat = Math.max(0, Number(row.querySelector(".vat").value) || 0);

    const gross = qty * price;
    const discountAmount = gross * discount / 100;
    const base = gross - discountAmount;
    const tax = base * vat / 100;

    subtotal += gross;
    discounts += discountAmount;
    vatTotal += tax;
    total += base + tax;

    row.querySelector(".amount").textContent = money(base + tax);
  });

  document.getElementById("subtotal").textContent = money(subtotal);
  document.getElementById("discountTotal").textContent = money(discounts);
  document.getElementById("vatTotal").textContent = money(vatTotal);
  document.getElementById("total").textContent = money(total);
}

function getFormData() {
  const data = {};

  document.querySelectorAll("input[id], textarea[id], select[id]").forEach(el => {
    if (el.id !== "language") data[el.id] = el.value;
  });

  data.items = [...document.querySelectorAll("#items tr")].map(row => ({
    desc: row.querySelector(".desc").value,
    qty: row.querySelector(".qty").value,
    price: row.querySelector(".price").value,
    discount: row.querySelector(".discount").value,
    vat: row.querySelector(".vat").value
  }));

  return data;
}

function tr(key) {

function numberValue(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function getTotals() {
  let subtotal = 0, discounts = 0, vatTotal = 0, total = 0;

  const items = [...document.querySelectorAll('#items tr')].map(row => {
    const qty = Math.max(0, numberValue(row.querySelector('.qty').value));
    const price = Math.max(0, numberValue(row.querySelector('.price').value));
    const discount = Math.min(
      100,
      Math.max(0, numberValue(row.querySelector('.discount').value))
    );
    const vat = Math.max(0, numberValue(row.querySelector('.vat').value));

    const base = qty * price * (1 - discount / 100);
    const tax = base * vat / 100;
    const lineTotal = base + tax;

    subtotal += qty * price;
    discounts += qty * price * discount / 100;
    vatTotal += tax;
    total += lineTotal;

    return { row, qty, price, discount, vat, lineTotal };
  });

  return { subtotal, discounts, vatTotal, total, items };
}

async function ensureUser() {
  const { data, error } = await _supabase.auth.getUser();

  if (error || !data?.user) {
    throw new Error(tr('loginRequired'));
  }

  currentUserId = data.user.id;
  return data.user;
}

function languageFromCountry(country) {
  const c = String(country || '').toLowerCase().trim();

  if (/bosnia|herzegovina|bosna|bih/.test(c)) return 'bs';
  if (/croatia|hrvatska/.test(c)) return 'hr';
  if (/serbia|srbija/.test(c)) return 'sr';
  if (/montenegro|crna gora/.test(c)) return 'me';
  if (/slovenia|slovenija/.test(c)) return 'sl';
  if (/macedonia|македонија/.test(c)) return 'mk';
  if (/germany|deutschland|austria|österreich/.test(c)) return 'de';
  if (/italy|italia/.test(c)) return 'it';
  if (/united kingdom|ireland|united states|canada|australia/.test(c)) return 'en';

  const browser = (navigator.language || 'bs').toLowerCase();
  return ({
    hr:'hr', sr:'sr', sl:'sl', mk:'mk', de:'de',
    it:'it', en:'en', bs:'bs', me:'me'
  })[browser.split('-')[0]] || 'bs';
}

function renderInvoiceList() {
  const list = document.getElementById('invoiceList');
  if (!list) return;

  const search = (
    document.getElementById('invoiceSearch')?.value || ''
  ).toLocaleLowerCase();

  const status =
    document.getElementById('invoiceStatusFilter')?.value || 'all';

  const selected = list.value;
  list.innerHTML = '';

  const first = document.createElement('option');
  first.value = '';
  first.textContent = tr('chooseInvoice');
  list.appendChild(first);

  const filtered = invoiceCache.filter(inv => {
    const hay = `${inv.BROJ_FAKTURE || ''} ${inv.KUPAC || ''}`
      .toLocaleLowerCase();

    return (!search || hay.includes(search)) &&
      (status === 'all' || inv.STATUS_FAKTURE === status);
  });

  filtered.forEach(inv => {
    const option = document.createElement('option');
    option.value = inv.ID;
    option.textContent =
      `${inv.BROJ_FAKTURE} — ${inv.KUPAC} — ` +
      `${Number(inv.IZNOS_FAKTURE || 0).toFixed(2)} ` +
      document.getElementById('currency').value;
    list.appendChild(option);
  });

  if (filtered.some(inv => inv.ID === selected)) {
    list.value = selected;
  }

  const hint = document.getElementById('invoiceListHint');
  if (hint) {
    hint.textContent = filtered.length
      ? `${filtered.length} — ${tr('invoiceList')}`
      : tr('noInvoices');
  }
}

async function refreshInvoiceList() {
  try {
    await ensureUser();

    const hint = document.getElementById('invoiceListHint');
    if (hint) hint.textContent = tr('loadingInvoices');

    const { data, error } = await _supabase
      .from('FAKTURE')
      .select(
        'ID,USER_ID,BROJ_FAKTURE,KUPAC,DATUM_FAKTURE,ROK_PLACANJA,IZNOS_FAKTURE,STATUS_FAKTURE,OPIS_FAKTURE,KREIRANO'
      )
      .eq('USER_ID', currentUserId)
      .order('KREIRANO', { ascending: false });

    if (error) throw error;

    invoiceCache = data || [];
    renderInvoiceList();
  } catch (e) {
    alert(tr('loadError') + (e.message || e));
  }
}

async function saveInvoice() {
  try {
    await ensureUser();

    const data = getFormData();

    if (!data.buyerName.trim() || !data.invoiceNumber.trim()) {
      alert(tr('buyerRequired'));
      return;
    }

    const totals = getTotals();

    const invoicePayload = {
      USER_ID: currentUserId,
      BROJ_FAKTURE: data.invoiceNumber.trim(),
      KUPAC: data.buyerName.trim(),
      DATUM_FAKTURE: data.invoiceDate ||
        new Date().toISOString().slice(0, 10),
      ROK_PLACANJA: data.dueDate || null,
      IZNOS_FAKTURE: Number(totals.total.toFixed(2)),
      OPIS_FAKTURE: [
        `Napomena: ${data.notes || ''}`,
        `Plaćanje: ${data.payment || ''}`,
        `Valuta: ${data.currency || 'BAM'}`,
        `Prodavac: ${data.sellerName || ''}`,
        `Adresa prodavca: ${data.sellerAddress || ''}`,
        `ID prodavca: ${data.sellerTax || ''}`,
        `PDV prodavca: ${data.sellerVat || ''}`,
        `Kontakt prodavca: ${data.sellerContact || ''}`,
        `Banka: ${data.sellerBank || ''}`,
        `Račun: ${data.sellerAccount || ''}`,
        `Kupac adresa: ${data.buyerAddress || ''}`,
        `Kupac ID: ${data.buyerTax || ''}`,
        `Kupac PDV: ${data.buyerVat || ''}`,
        `Kupac kontakt: ${data.buyerContact || ''}`,
        `Izdao: ${data.issuer || ''}`
      ].join('\n')
    };

    let invoice;

    if (activeInvoiceId) {
      const { data: updated, error: updateError } = await _supabase
        .from('FAKTURE')
        .update(invoicePayload)
        .eq('ID', activeInvoiceId)
        .eq('USER_ID', currentUserId)
        .select('ID')
        .single();

      if (updateError) throw updateError;
      invoice = updated;

      const { error: deleteLinesError } = await _supabase
        .from('STAVKE_FAKTURA')
        .delete()
        .eq('FAKTURA_ID', invoice.ID)
        .eq('USER_ID', currentUserId);

      if (deleteLinesError) throw deleteLinesError;
    } else {
      const { data: created, error: insertError } = await _supabase
        .from('FAKTURE')
        .insert({
          ...invoicePayload,
          STATUS_FAKTURE: 'NEPLACENA'
        })
        .select('ID')
        .single();

      if (insertError) throw insertError;
      invoice = created;
    }

    const lineRows = totals.items
      .filter(x => x.row.querySelector('.desc').value.trim())
      .map(x => ({
        FAKTURA_ID: invoice.ID,
        USER_ID: currentUserId,
        NAZIV_STAVKE: x.row.querySelector('.desc').value.trim(),
        OPIS: null,
        KOLICINA: x.qty,
        JEDINICA_MJERE: 'kom',
        CIJENA: x.price,
        POPUST: x.discount,
        PDV_STOPA: x.vat,
        UKUPNO: Number(x.lineTotal.toFixed(2))
      }));

    if (lineRows.length) {
      const { error: lineError } = await _supabase
        .from('STAVKE_FAKTURA')
        .insert(lineRows);

      if (lineError) {
        console.error(lineError);
        alert(tr('linesError') + '\n' + lineError.message);
        await refreshInvoiceList();
        return;
      }
    }

    activeInvoiceId = invoice.ID;
    await refreshInvoiceList();
    document.getElementById('invoiceList').value = invoice.ID;
    alert(tr('savedOk'));
  } catch (e) {
    console.error(e);
    alert(tr('saveError') + (e.message || e));
  }
}

async function loadInvoice() {
  const id = document.getElementById('invoiceList').value;
  if (!id) {
    alert(tr('chooseInvoice'));
    return;
  }

  try {
    await ensureUser();

    const { data: inv, error } = await _supabase
      .from('FAKTURE')
      .select('*')
      .eq('ID', id)
      .eq('USER_ID', currentUserId)
      .single();

    if (error) throw error;

    const { data: lines, error: lineError } = await _supabase
      .from('STAVKE_FAKTURA')
      .select('*')
      .eq('FAKTURA_ID', id)
      .eq('USER_ID', currentUserId)
      .order('KREIRANO', { ascending: true });

    if (lineError) throw lineError;

    activeInvoiceId = inv.ID;

    const description = inv.OPIS_FAKTURE || '';
    const getMeta = label => {
      const m = description.split('\n').find(line => line.startsWith(label));
      return m ? m.slice(label.length).trim() : '';
    };

    const noteLine = description.split('\n')
      .find(line => line.startsWith('Napomena:')) || 'Napomena:';

    const values = {
      invoiceNumber: inv.BROJ_FAKTURE || '',
      buyerName: inv.KUPAC || '',
      invoiceDate: inv.DATUM_FAKTURE || '',
      dueDate: inv.ROK_PLACANJA || '',
      notes: noteLine.slice('Napomena:'.length).trim(),
      payment: getMeta('Plaćanje:') || 'transfer',
      currency: getMeta('Valuta:') || 'BAM',
      sellerName: getMeta('Prodavac:'),
      sellerAddress: getMeta('Adresa prodavca:'),
      sellerTax: getMeta('ID prodavca:'),
      sellerVat: getMeta('PDV prodavca:'),
      sellerContact: getMeta('Kontakt prodavca:'),
      sellerBank: getMeta('Banka:'),
      sellerAccount: getMeta('Račun:'),
      buyerAddress: getMeta('Kupac adresa:'),
      buyerTax: getMeta('Kupac ID:'),
      buyerVat: getMeta('Kupac PDV:'),
      buyerContact: getMeta('Kupac kontakt:'),
      issuer: getMeta('Izdao:')
    };

    Object.entries(values).forEach(([key, value]) => {
      const el = document.getElementById(key);
      if (el) el.value = value;
    });

    const tbody = document.getElementById('items');
    tbody.innerHTML = '';

    (lines || []).forEach(line => {
      addItem(
        line.NAZIV_STAVKE || '',
        line.KOLICINA,
        line.CIJENA,
        line.POPOUST ?? line.POPUST ?? 0,
        line.PDV_STOPA ?? 0
      );
    });

    if (!lines?.length) addItem();

    changeLanguage();
    calculate();
    alert(tr('loadedOk'));
  } catch (e) {
    console.error(e);
    alert(tr('loadError') + (e.message || e));
  }
}
