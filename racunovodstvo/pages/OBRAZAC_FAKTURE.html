<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocBizHub — Faktura</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f2f6fc;
  color: #183153;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 5px 25px #17345b12;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  border-bottom: 2px solid #1769e8;
  padding-bottom: 15px;
}

h1 { margin: 0; color: #1769e8; }

h2 {
  font-size: 17px;
  margin-top: 24px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

label {
  display: block;
  margin: 10px 0 5px;
  font-size: 13px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccd8e8;
  border-radius: 6px;
  font: inherit;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

th, td {
  padding: 8px;
  border: 1px solid #dce5f0;
  text-align: left;
}

th { background: #edf4ff; }

td input { min-width: 65px; }

button {
  padding: 10px 14px;
  margin: 5px 3px 5px 0;
  border: 0;
  border-radius: 6px;
  background: #1769e8;
  color: white;
  cursor: pointer;
}

.delete { background: #d93025; }

.totals {
  max-width: 420px;
  margin: 20px 0 0 auto;
}

.totals div {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.grand {
  background: #1769e8;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

@media(max-width: 750px) {
  .grid { grid-template-columns: 1fr; }
  .table-wrap { overflow-x: auto; }
}

@media print {
  body { background: white; padding: 0; }
  .container { box-shadow: none; padding: 0; }
  .no-print { display: none !important; }
  input, select, textarea {
    border: none;
    padding: 2px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div>
    <h1 data-i18n="title">FAKTURA</h1>
    <p>DocBizHub</p>
  </div>

  <div>
    <label for="language" data-i18n="language">Jezik</label>
    <select id="language" onchange="changeLanguage()">

      <option value="hr">🇭🇷 Hrvatski</option>
      <option value="sr">🇷🇸 Srpski</option>
      <option value="me">🇲🇪 Crnogorski</option>
      <option value="sl">🇸🇮 Slovenski</option>
      <option value="mk">🇲🇰 Makedonski</option>
      <option value="en">🇬🇧 English</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="it">🇮🇹 Italiano</option>
    </select>
  </div>
</header>

<div class="grid">
  <section>
    <h2 data-i18n="seller">Podaci o prodavcu</h2>

    <label data-i18n="company">Firma</label>
    <input id="sellerName">

    <label data-i18n="address">Adresa</label>
    <input id="sellerAddress">

    <label data-i18n="tax">JIB / ID broj</label>
    <input id="sellerTax">

    <label data-i18n="vatid">PDV broj</label>
    <input id="sellerVat">

    <label data-i18n="contact">Telefon / e-mail</label>
    <input id="sellerContact">

    <label data-i18n="bank">Banka</label>
    <input id="sellerBank">

    <label data-i18n="account">Transakcijski račun</label>
    <input id="sellerAccount">
  </section>

  <section>
    <h2 data-i18n="buyer">Podaci o kupcu</h2>

    <label data-i18n="company">Firma / ime kupca</label>
    <input id="buyerName">

    <label data-i18n="address">Adresa</label>
    <input id="buyerAddress">

    <label data-i18n="tax">JIB / ID broj</label>
    <input id="buyerTax">

    <label data-i18n="vatid">PDV broj</label>
    <input id="buyerVat">

    <label data-i18n="contact">Telefon / e-mail</label>
    <input id="buyerContact">
  </section>

  <section>
    <h2 data-i18n="details">Podaci o fakturi</h2>

    <label data-i18n="number">Broj fakture</label>
    <input id="invoiceNumber" value="2026-001">

    <label data-i18n="issued">Datum izdavanja</label>
    <input id="invoiceDate" type="date">

    <label data-i18n="due">Datum dospijeća</label>
    <input id="dueDate" type="date">

    <label data-i18n="currency">Valuta</label>
    <select id="currency" onchange="calculate()">
      <option value="BAM">BAM / KM</option>
      <option value="EUR">EUR / €</option>
      <option value="RSD">RSD</option>
      <option value="MKD">MKD</option>
    </select>
  </section>
</div>

<h2 data-i18n="items">Stavke fakture</h2>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th data-i18n="description">Opis</th>
      <th data-i18n="qty">Količina</th>
      <th data-i18n="price">Cijena</th>
      <th data-i18n="discount">Rabat %</th>
      <th data-i18n="vat">PDV %</th>
      <th data-i18n="amount">Iznos</th>
      <th class="no-print">×</th>
    </tr>
  </thead>
  <tbody id="items"></tbody>
</table>
</div>

<button class="no-print" onclick="addItem()" data-i18n="add">
  + Dodaj stavku
</button>

<div class="grid">
  <section>
    <h2 data-i18n="notes">Napomena</h2>
    <textarea id="notes" rows="4"></textarea>
  </section>

  <section>
    <h2 data-i18n="payment">Plaćanje</h2>
    <label data-i18n="method">Način plaćanja</label>
    <select id="payment">
      <option value="transfer">Bankovni transfer</option>
      <option value="cash">Gotovina</option>
      <option value="card">Kartica</option>
    </select>
    <label data-i18n="issuer">Fakturu izdao/la</label>
    <input id="issuer">
  </section>
</div>

<div class="totals">
  <div>
    <span data-i18n="subtotal">Osnovica</span>
    <strong id="subtotal">0,00</strong>
  </div>
  <div>
    <span data-i18n="discountTotal">Rabat</span>
    <strong id="discountTotal">0,00</strong>
  </div>
  <div>
    <span data-i18n="vatTotal">PDV</span>
    <strong id="vatTotal">0,00</strong>
  </div>
  <div class="grand">
    <span data-i18n="total">UKUPNO</span>
    <strong id="total">0,00</strong>
  </div>
</div>

<div class="no-print" style="margin-top:20px">
  <button onclick="saveInvoice()" data-i18n="save">Sačuvaj</button>
  <button onclick="loadInvoice()" data-i18n="load">Učitaj sačuvano</button>
  <button onclick="window.print()" data-i18n="print">Štampaj / PDF</button>
  <button onclick="newInvoice()" data-i18n="new">Nova faktura</button>
</div>

</div>

function changeLanguage() {
  const lang = document.getElementById("language").value;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
}

function addItem(desc="", qty=1, price=0, discount=0, vat=17) {
  const row = document.createElement("tr");
  row.innerHTML = `
    <td class="index"></td>
    <td><input class="desc" value="${escapeHTML(desc)}"></td>
    <td><input class="qty" type="number" min="0" step="any" value="${qty}"></td>
    <td><input class="price" type="number" min="0" step="any" value="${price}"></td>
    <td><input class="discount" type="number" min="0" max="100" value="${discount}"></td>
    <td><input class="vat" type="number" min="0" max="100" value="${vat}"></td>
    <td class="amount">0.00</td>
    <td class="no-print"><button class="delete" type="button">×</button></td>`;
  document.getElementById("items").appendChild(row);
  row.querySelectorAll("input").forEach(input => input.addEventListener("input", calculate));
  row.querySelector(".delete").onclick = () => { row.remove(); renumber(); calculate(); };
  renumber();
  calculate();
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function renumber() {
  document.querySelectorAll("#items tr").forEach((row, i) => {
    row.querySelector(".index").textContent = i + 1;
  });
}

function money(value) {
  const currency = document.getElementById("currency").value;
  try {
    return new Intl.NumberFormat("bs-BA", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(value) + " " + currency;
  } catch { return value.toFixed(2) + " " + currency; }
}

function calculate() {
  let subtotal = 0, discounts = 0, vatTotal = 0, total = 0;
  document.querySelectorAll("#items tr").forEach(row => {
    const qty = Math.max(0, Number(row.querySelector(".qty").value) || 0);
    const price = Math.max(0, Number(row.querySelector(".price").value) || 0);
    const discount = Math.min(100, Math.max(0, Number(row.querySelector(".discount").value) || 0));
    const vat = Math.max(0, Number(row.querySelector(".vat").value) || 0);
    const gross = qty * price;
    const discountAmount = gross * discount / 100;
    const base = gross - discountAmount;
    const tax = base * vat / 100;
    subtotal += gross;
    discounts += discountAmount;
    vatTotal += tax;
    total += base + tax;
    row.querySelector(".amount").textContent = money(base + tax);
  });
  document.getElementById("subtotal").textContent = money(subtotal);
  document.getElementById("discountTotal").textContent = money(discounts);
  document.getElementById("vatTotal").textContent = money(vatTotal);
  document.getElementById("total").textContent = money(total);
}

function getFormData() {
  const data = {};
  document.querySelectorAll("input[id], textarea[id], select[id]").forEach(el => {
    if (el.id !== "language") data[el.id] = el.value;
  });
  data.items = [...document.querySelectorAll("#items tr")].map(row => ({
    desc: row.querySelector(".desc").value,
    qty: row.querySelector(".qty").value,
    price: row.querySelector(".price").value,
    discount: row.querySelector(".discount").value,
    vat: row.querySelector(".vat").value
  }));
  return data;
}

function saveInvoice() {
  localStorage.setItem("docbizhub_invoice", JSON.stringify(getFormData()));
  alert("Faktura je sačuvana u ovom pregledniku.");
}

function loadInvoice() {
  const saved = localStorage.getItem("docbizhub_invoice");
  if (!saved) return alert("Nema sačuvane fakture u ovom pregledniku.");
  const data = JSON.parse(saved);
  Object.entries(data).forEach(([key, value]) => {
    const el = document.getElementById(key);
    if (el && key !== "items") el.value = value;
  });
  document.getElementById("items").innerHTML = "";
  (data.items || []).forEach(item =>
    addItem(item.desc, item.qty, item.price, item.discount, item.vat)
  );
  if (!data.items || !data.items.length) addItem();
  changeLanguage();
  calculate();
}

function newInvoice() {
  if (!confirm("Započeti novu fakturu?")) return;
  document.querySelectorAll("input[id], textarea[id]").forEach(el => el.value = "");
  document.getElementById("invoiceNumber").value = "";
  document.getElementById("items").innerHTML = "";
  addItem();
  calculate();
}

document.getElementById("currency").addEventListener("change", calculate);
document.getElementById("invoiceDate").value = new Date().toISOString().slice(0,10);
addItem();
</script>
